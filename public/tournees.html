<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F7F8">
  <title>Tournées de livraison — Le Gué des Moines</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>
  <script src="tournees-import.js"></script>
  <style>
    [hidden] { display: none !important; }
    input[type="tel"] { width: 100%; min-height: var(--cible); padding: var(--e2) var(--e3); border: 1px solid var(--bordure-forte);
      border-radius: var(--r-sm); font-family: inherit; font-size: var(--t-md); background: var(--surface); color: var(--texte); }
    main.tl { max-width: 1240px; }

    /* --- Boutons de la rubrique ------------------------------------------- */
    .tl-btn { min-height: 38px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--bordure-forte);
      background: var(--surface); color: var(--texte); font-weight: 600; font-size: var(--t-sm); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; width: auto; }
    .tl-btn:hover:not(:disabled) { background: var(--surface-3); }
    .tl-btn.principal { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }
    .tl-btn.principal:hover:not(:disabled) { background: var(--accent-fonce); }
    .tl-btn.danger { color: var(--danger); }
    .tl-btn.danger:hover:not(:disabled) { background: var(--danger-doux); border-color: var(--danger); }
    .tl-btn.discret { border-color: transparent; background: transparent; color: var(--texte-2); }
    .tl-btn.discret:hover:not(:disabled) { background: var(--surface-3); color: var(--texte); }
    .tl-btn.mini { min-height: 30px; padding: 0 9px; font-size: var(--t-xs); }
    .tl-btn.carre { width: 32px; min-width: 32px; padding: 0; justify-content: center; min-height: 32px; }
    .tl-btn:disabled { opacity: .45; cursor: not-allowed; }
    .tl-btn .ico { width: 15px; height: 15px; }

    /* --- Barre de navigation de la rubrique --------------------------------- */
    .tl-barre { display: flex; align-items: center; gap: var(--e3); flex-wrap: wrap; }
    .tl-onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-right: auto; }
    .tl-onglets a { min-height: 36px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--bordure);
      background: var(--surface); color: var(--texte-2); font-weight: 600; font-size: var(--t-sm); text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px; }
    .tl-onglets a:hover { background: var(--surface-3); color: var(--texte); }
    .tl-onglets a[aria-current="page"] { background: var(--accent-doux); border-color: var(--accent); color: var(--accent-texte); }
    .tl-onglets .nb { font-size: var(--t-xs); font-weight: 700; background: var(--surface-3); border-radius: 999px; padding: 0 7px; color: var(--texte-2); }
    .tl-onglets a[aria-current="page"] .nb { background: var(--accent); color: var(--sur-accent); }

    /* --- Statuts : pastilles ------------------------------------------------- */
    .st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.6875rem;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent; }
    .st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .st.a_livrer, .st.a_venir { background: var(--surface-3); color: var(--texte-2); border-color: var(--bordure-forte); }
    .st.livree, .st.terminee { background: var(--ok-doux); color: var(--ok); }
    .st.probleme { background: var(--danger-doux); color: var(--danger); }
    .st.en_cours { background: var(--accent-doux); color: var(--accent-texte); border-color: var(--accent); }
    .st.vide, .st.cloturee { background: var(--surface-2); color: var(--texte-3); border-color: var(--bordure); }
    .st.retard { background: var(--alerte-doux); color: var(--alerte); }

    /* --- Barre de progression segmentée ------------------------------------ */
    .prog { display: flex; height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; gap: 2px; }
    .prog i { display: block; height: 100%; }
    .prog .l { background: var(--ok); } .prog .p { background: var(--danger); }
    .compteurs { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: var(--t-sm); color: var(--texte-2); }
    .compteurs b { color: var(--texte); font-variant-numeric: tabular-nums; }
    .compteurs .c::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--bordure-forte); }
    .compteurs .c.l::before { background: var(--ok); } .compteurs .c.p::before { background: var(--danger); }

    /* --- Liste des tournées ------------------------------------------------ */
    .kpi-ligne { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e3); }
    @media (max-width: 700px) { .kpi-ligne { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .kpi-ligne .kpi .val.ok { color: var(--ok); } .kpi-ligne .kpi .val.ko { color: var(--danger); }
    .grille-tournees { display: grid; gap: var(--e4); grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .tl-carte { background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--r-lg); padding: var(--e4);
      display: flex; flex-direction: column; gap: var(--e3); box-shadow: var(--ombre-1); cursor: pointer;
      transition: border-color var(--v-rapide) var(--courbe); border-top: 3px solid var(--bordure-forte); }
    .tl-carte:hover { border-color: var(--bordure-forte); }
    .tl-carte.en_cours { border-top-color: var(--accent); }
    .tl-carte.terminee { border-top-color: var(--ok); }
    .tl-carte.avec-probleme { border-top-color: var(--danger); }
    .tl-carte .tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tl-carte .quand { font-size: var(--t-xs); font-weight: 600; color: var(--texte-2); text-transform: uppercase; letter-spacing: .05em; }
    .tl-carte .quand.auj { color: var(--accent-texte); }
    .tl-carte h3 { font-size: var(--t-lg); margin: 0; }
    .tl-carte .meta { font-size: var(--t-sm); color: var(--texte-2); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
    .tl-carte .meta .ico { color: var(--texte-3); }
    .tl-carte .pied { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--bordure); padding-top: var(--e3); }
    .vide-bloc { text-align: center; padding: 48px 16px; color: var(--texte-2); display: flex; flex-direction: column; align-items: center; gap: 12px;
      background: var(--surface); border: 1px dashed var(--bordure-forte); border-radius: var(--r-lg); }
    .vide-bloc .ico { width: 32px; height: 32px; color: var(--texte-3); }
    .msg-erreur { background: var(--danger-doux); color: var(--danger); border-radius: var(--r-md); padding: 10px 14px; font-size: var(--t-sm);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .msg-ok { background: var(--ok-doux); color: var(--ok); border-radius: var(--r-md); padding: 10px 14px; font-size: var(--t-sm); font-weight: 600; }

    /* --- Suivi d'une tournée ---------------------------------------------- */
    .fil { display: inline-flex; align-items: center; gap: 6px; color: var(--texte-2); text-decoration: none; font-size: var(--t-sm); font-weight: 600; }
    .fil:hover { color: var(--texte); }
    .entete-tournee { display: flex; justify-content: space-between; gap: var(--e4); flex-wrap: wrap; align-items: flex-start; }
    .entete-tournee h2 { font-size: var(--t-xl); margin: 0 0 4px; }
    .entete-tournee .meta { font-size: var(--t-sm); color: var(--texte-2); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
    .entete-tournee .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .bloc { background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--r-lg); padding: var(--e4) var(--e5); box-shadow: var(--ombre-1); }
    .bloc > h3 { font-size: var(--t-md); margin: 0 0 var(--e3); display: flex; align-items: center; gap: 8px; }
    .bloc > h3 .ico { color: var(--texte-3); }
    .avancement { display: flex; flex-direction: column; gap: 10px; }
    .avancement .phrase { font-size: var(--t-lg); font-weight: 700; }
    .avancement .phrase b { color: var(--accent-texte); font-variant-numeric: tabular-nums; }

    .partage { display: flex; flex-direction: column; gap: 10px; }
    .partage .lien-ligne { display: flex; gap: 8px; flex-wrap: wrap; }
    .partage input { flex: 1 1 280px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--t-xs); min-height: 38px; }
    .partage .directs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: var(--t-sm); color: var(--texte-2); }
    .partage .note { font-size: var(--t-xs); color: var(--texte-3); }

    .filtres-statut { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--e3); }
    .filtres-statut button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--bordure); background: var(--surface);
      color: var(--texte-2); font-size: var(--t-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; width: auto; }
    .filtres-statut button[aria-pressed="true"] { background: var(--accent-doux); color: var(--accent-texte); border-color: var(--accent); }

    .arrets-suivi { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
    .arrets-suivi th { text-align: left; font-size: var(--t-xs); color: var(--texte-2); font-weight: 600; padding: 8px 10px;
      border-bottom: 1px solid var(--bordure); background: var(--surface-2); white-space: nowrap; }
    .arrets-suivi td { padding: 10px; border-bottom: 1px solid var(--bordure); vertical-align: top; }
    .arrets-suivi tr:last-child td { border-bottom: 0; }
    .arrets-suivi tr.livree td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
    .arrets-suivi tr.probleme td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
    .arrets-suivi .num { font-weight: 700; color: var(--accent-texte); font-variant-numeric: tabular-nums; width: 34px; }
    .arrets-suivi .cli { font-weight: 600; }
    .arrets-suivi .adr { color: var(--texte-2); font-size: var(--t-xs); margin-top: 2px; }
    .arrets-suivi .consigne { font-size: var(--t-xs); color: var(--texte-2); white-space: pre-line; max-width: 260px; }
    .arrets-suivi .quand { font-size: var(--t-xs); color: var(--texte-2); white-space: nowrap; }
    .arrets-suivi .quand b { color: var(--texte); font-size: var(--t-sm); }
    .commentaire { margin-top: 4px; font-size: var(--t-xs); color: var(--danger); background: var(--danger-doux); border-radius: 6px; padding: 5px 8px; white-space: pre-line; }
    a.tel { color: var(--texte); text-decoration: none; white-space: nowrap; }
    a.tel:hover { color: var(--accent-texte); text-decoration: underline; }
    @media (max-width: 760px) {
      .arrets-suivi thead { display: none; }
      .arrets-suivi, .arrets-suivi tbody, .arrets-suivi tr, .arrets-suivi td { display: block; }
      .arrets-suivi tr { border: 1px solid var(--bordure); border-radius: var(--r-md); padding: 8px 10px; margin-bottom: 8px; }
      .arrets-suivi td { border: 0; padding: 3px 0; }
      .arrets-suivi tr.livree { border-left: 3px solid var(--ok); } .arrets-suivi tr.probleme { border-left: 3px solid var(--danger); }
      .arrets-suivi tr td:first-child { box-shadow: none !important; }
      .arrets-suivi .num { display: inline-block; }
    }

    .journal { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .journal li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--bordure); font-size: var(--t-sm); }
    .journal li:last-child { border-bottom: 0; }
    .journal .h { font-variant-numeric: tabular-nums; color: var(--texte-2); font-weight: 600; min-width: 92px; }
    .journal .q { color: var(--texte-2); }

    /* --- Éditeur de tournée -------------------------------------------------- */
    .ed-entete { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: var(--e3); }
    @media (max-width: 760px) { .ed-entete { grid-template-columns: 1fr; } }
    .ed-entete label { margin-bottom: 4px; font-weight: 600; }
    .ed-entete .livreur-ligne { display: flex; gap: 6px; }
    .ed-outils { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ed-outils .sep { flex: 1; }
    .recherche-client { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface-2);
      border: 1px solid var(--bordure); border-radius: var(--r-md); padding: 10px 12px; }
    .recherche-client input { flex: 1 1 260px; min-height: 36px; }
    .resume-adresses { font-size: var(--t-sm); color: var(--texte-2); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
    .resume-adresses .a { color: var(--alerte); font-weight: 600; } .resume-adresses .e { color: var(--danger); font-weight: 600; }
    .resume-adresses .o { color: var(--ok); font-weight: 600; }

    .ed-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .ed-arret { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--surface);
      border: 1px solid var(--bordure); border-radius: var(--r-md); padding: 10px; transition: box-shadow var(--v-rapide); }
    .ed-arret.glisse { box-shadow: var(--ombre-3); border-color: var(--accent); opacity: .92; position: relative; z-index: 5; }
    .ed-arret.livree { border-left: 3px solid var(--ok); } .ed-arret.probleme { border-left: 3px solid var(--danger); }
    .ed-poignee { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: grab; touch-action: none; user-select: none;
      color: var(--texte-3); padding: 4px 2px; border-radius: 6px; }
    .ed-poignee:hover { background: var(--surface-3); color: var(--texte-2); }
    .ed-poignee:active { cursor: grabbing; }
    .ed-poignee .n { font-weight: 700; color: var(--accent-texte); font-size: var(--t-md); font-variant-numeric: tabular-nums; }
    .ed-champs { display: grid; grid-template-columns: 1fr 1.6fr; gap: 6px; min-width: 0; }
    .ed-champs .large { grid-column: 1 / -1; }
    .ed-champs input, .ed-champs textarea { min-height: 34px; font-size: var(--t-sm); padding: 6px 10px; }
    .ed-champs textarea { min-height: 34px; height: 34px; resize: vertical; }
    .ed-champs .ligne2 { display: grid; grid-template-columns: 180px 1fr; gap: 6px; grid-column: 1 / -1; }
    @media (max-width: 760px) { .ed-champs, .ed-champs .ligne2 { grid-template-columns: 1fr; } }
    .ed-actions { display: flex; flex-direction: column; gap: 4px; }
    .ed-etat { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--t-xs); }

    .verif { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 600; }
    .verif .ico { width: 14px; height: 14px; }
    .verif.ok { color: var(--ok); } .verif.avertissement { color: var(--alerte); } .verif.erreur { color: var(--danger); }
    .verif.inconnu, .verif.attente { color: var(--texte-3); font-weight: 500; }
    .proposition { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--t-xs); color: var(--texte-2); }
    .proposition button { min-height: 24px; padding: 0 8px; font-size: var(--t-xs); border-radius: 6px; border: 1px solid var(--bordure-forte);
      background: var(--surface); font-weight: 600; width: auto; }
    .proposition button:hover { border-color: var(--accent); color: var(--accent-texte); }
    .ed-pied { position: sticky; bottom: 0; z-index: 20; background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--r-lg);
      padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: var(--ombre-3); }
    .ed-pied .info { margin-right: auto; font-size: var(--t-sm); color: var(--texte-2); }

    /* --- Fenêtres (aperçu d'import, collage, livreur) ----------------------- */
    dialog.tl-dialog { border: 1px solid var(--bordure); border-radius: var(--r-lg); padding: 0; background: var(--surface); color: var(--texte);
      box-shadow: var(--ombre-3); width: min(1180px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
    dialog.tl-dialog.petit { width: min(560px, calc(100vw - 24px)); }
    dialog.tl-dialog::backdrop { background: rgba(9,9,11,.55); }
    .dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 26px); }
    .dlg-tete { padding: 16px 20px; border-bottom: 1px solid var(--bordure); display: flex; gap: 12px; align-items: flex-start; }
    .dlg-tete h2 { font-size: var(--t-lg); margin: 0; }
    .dlg-tete p { font-size: var(--t-sm); color: var(--texte-2); margin-top: 2px; }
    .dlg-tete .tl-btn { margin-left: auto; }
    .dlg-corps { padding: 16px 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
    .dlg-pied { padding: 12px 20px; border-top: 1px solid var(--bordure); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .dlg-pied .info { margin-right: auto; font-size: var(--t-sm); color: var(--texte-2); display: flex; gap: 12px; flex-wrap: wrap; }
    .colonnes-import { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; background: var(--surface-2);
      border: 1px solid var(--bordure); border-radius: var(--r-md); padding: 10px 12px; }
    .colonnes-import label { font-size: var(--t-xs); margin-bottom: 2px; font-weight: 600; }
    .colonnes-import select { min-height: 32px; font-size: var(--t-xs); padding: 4px 28px 4px 8px; }
    .apercu-table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
    .apercu-table th { text-align: left; font-size: var(--t-xs); color: var(--texte-2); padding: 6px; border-bottom: 1px solid var(--bordure);
      position: sticky; top: -16px; background: var(--surface); z-index: 1; }
    .apercu-table td { padding: 6px; border-bottom: 1px solid var(--bordure); vertical-align: top; }
    .apercu-table tr.exclu td { opacity: .45; }
    .apercu-table tr.ap-erreur td { background: var(--danger-doux); }
    .apercu-table tr.ap-avertissement td { background: var(--alerte-doux); }
    .apercu-table input[type="text"], .apercu-table textarea { min-height: 32px; font-size: var(--t-xs); padding: 4px 8px; }
    .apercu-table textarea { height: 32px; min-height: 32px; resize: vertical; }
    .apercu-table th:nth-child(-n+2), .apercu-table td:nth-child(-n+2) { width: 1%; white-space: nowrap; }
    .apercu-table .c-nom { width: 19%; } .apercu-table .c-adr { width: 33%; } .apercu-table .c-tel { width: 14%; }
    .apercu-table .c-cons { width: 30%; }
    .apercu-table input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    @media (max-width: 860px) {
      .apercu-table thead { display: none; }
      .apercu-table, .apercu-table tbody, .apercu-table tr, .apercu-table td { display: block; width: auto !important; }
      .apercu-table tr { border: 1px solid var(--bordure); border-radius: var(--r-md); margin-bottom: 8px; padding: 6px; }
      .apercu-table td { border: 0; }
    }
    .options-import { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--t-sm); }
    .options-import label { display: inline-flex; gap: 6px; align-items: center; margin: 0; font-weight: 500; color: var(--texte); }
    .options-import input { accent-color: var(--accent); }

    .livreurs-liste { display: flex; flex-direction: column; gap: 8px; }
    .livreur { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--bordure);
      border-radius: var(--r-md); padding: 12px 14px; }
    .livreur .qui { flex: 1 1 220px; min-width: 0; }
    .livreur .qui b { display: block; }
    .livreur .qui span { font-size: var(--t-sm); color: var(--texte-2); }
    .livreur.inactif { opacity: .6; }
    .form-ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .form-ligne > div { flex: 1 1 200px; }
    .form-ligne label { margin-bottom: 4px; font-weight: 600; }

    .table-histo { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
    .table-histo th { text-align: left; font-size: var(--t-xs); color: var(--texte-2); padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--bordure); }
    .table-histo td { padding: 10px; border-bottom: 1px solid var(--bordure); }
    .table-histo tbody tr { cursor: pointer; } .table-histo tbody tr:hover { background: var(--surface-2); }
    .table-histo .n { font-variant-numeric: tabular-nums; text-align: right; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; background: var(--texte); color: var(--fond);
      padding: 10px 16px; border-radius: var(--r-md); font-size: var(--t-sm); font-weight: 600; box-shadow: var(--ombre-3); max-width: calc(100vw - 32px); }
