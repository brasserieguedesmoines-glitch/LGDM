<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F7F8">
  <title>Prospection — Le Gué des Moines</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>
  <script src="donnees.js"></script>
  <style>
    /* ---- Bandeau de synchronisation ---- */
    .sync { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap;
            font-size: var(--t-sm); padding: var(--e2) var(--e3); border-radius: var(--r-sm);
            margin-bottom: var(--e4); border: 1px solid var(--bordure); background: var(--surface-2); }
    .sync[data-etat="ok"]     { border-left: 3px solid var(--ok); }
    .sync[data-etat="ancien"] { border-left: 3px solid var(--alerte); background: var(--alerte-doux); }
    .sync[data-etat="erreur"] { border-left: 3px solid var(--danger); background: var(--danger-doux); }
    .sync button { margin-left: auto; min-height: 28px; padding: 0 var(--e3); font-size: var(--t-sm);
                   border: 1px solid var(--bordure-forte); background: var(--surface);
                   color: var(--texte); border-radius: var(--r-sm); }

    /* ---- Compteurs cliquables ---- */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                gap: var(--e3); margin-bottom: var(--e5); }
    .kpi { background: var(--surface); border: 1px solid var(--bordure);
           border-top: 3px solid var(--bordure-forte); border-radius: var(--r-md);
           padding: var(--e3) var(--e4); text-align: left; cursor: pointer; width: 100%; }
    .kpi:hover { background: var(--surface-2); }
    .rp-grille { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: var(--e4); align-items: start; }
    @media (max-width: 960px) { .rp-grille { grid-template-columns: 1fr; } }
    .rp-carte { background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--r-lg); padding: var(--e4); margin-bottom: var(--e3); }
    .rp-carte h3 { font-size: var(--t-md); margin-bottom: var(--e3); }
    .rp-champ { margin-bottom: var(--e3); min-width: 0; }
    .rp-champ label, .rp-lbl { display: block; font-size: var(--t-xs); font-weight: 600; color: var(--texte-2); margin-bottom: 4px; }
    .rp-champ input, .rp-champ select, .rp-champ textarea { width: 100%; }
    .rp-ligne { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
    .rp-duo { display: flex; gap: 6px; } .rp-duo input { flex: 1; min-width: 0; } .rp-duo select { width: auto; }
    .rp-puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .rp-puces button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--bordure-forte);
      background: var(--surface-2); color: var(--texte); font-weight: 600; font-size: var(--t-sm); cursor: pointer; }
    .rp-puces button[aria-pressed="true"] { background: var(--accent-doux); border-color: var(--accent); color: var(--accent-texte); }
    .rp-retards label { display: flex; gap: 8px; align-items: center; font-size: var(--t-sm); color: var(--texte); font-weight: 400; margin: 4px 0; }
    .rp-retards input { width: auto; }
    #cr-ok { width: 100%; min-height: 44px; }
    .rp-etapes { list-style: none; padding: 0; margin: var(--e2) 0; font-size: var(--t-sm); }
    .rp-etapes li { padding: 3px 0; } .rp-etapes .ok { color: var(--ok); } .rp-etapes .ko { color: var(--danger); } .rp-etapes .attente { color: var(--texte-2); }
    .rp-deux { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e3); }
    @media (max-width: 640px) { .rp-deux, .rp-ligne { grid-template-columns: 1fr; } }
    .rp-barre { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--bordure); font-size: var(--t-sm); }
    .rp-entonnoir { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: var(--t-sm); margin: 6px 0; }
    .rp-entonnoir i { display: block; height: 14px; border-radius: 4px; background: var(--accent); }
    .rp-entonnoir b { text-align: right; }
    .rp-cr { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0;
      border-bottom: 1px solid var(--bordure); padding: 10px 0; color: var(--texte); font-size: var(--t-sm); cursor: pointer; }
    .rp-cr:hover { background: var(--surface-2); }
    .etat-ligne { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #f-etat-contact { width: auto; min-height: 32px; padding: 2px 8px; font-weight: 600; }
    .kpi.actif { background: var(--surface-2); outline: 2px solid var(--accent, var(--alerte)); outline-offset: -2px; }
    .kpi-grid:has(.actif) .kpi:not(.actif) { opacity: .55; }
    .filtre-actif { display: flex; align-items: center; gap: var(--e2); font-size: var(--t-sm); color: var(--texte-2); margin-bottom: var(--e3); }
    .filtre-actif button { min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--bordure);
      background: var(--surface-2); color: var(--texte); font-weight: 600; cursor: pointer; }
    .kpi .lbl { font-size: var(--t-xs); font-weight: 500; color: var(--texte-2); }
    .kpi .val { font-size: var(--t-kpi); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .kpi.retard { border-top-color: var(--danger); } .kpi.retard .val { color: var(--danger); }
    .kpi.jour   { border-top-color: var(--alerte); } .kpi.jour .val { color: var(--alerte); }
    .kpi.visite { border-top-color: var(--info); }   .kpi.visite .val { color: var(--info); }
    .kpi.perdus { border-top-color: var(--texte-3); } .kpi.perdus .val { color: var(--texte-2); }
    .rang.perdu { opacity: .75; border-left-color: var(--texte-3); }

    /* ---- Filtres ---- */
    .filtres { display: flex; flex-wrap: wrap; gap: var(--e2) var(--e3); align-items: flex-end;
               margin-bottom: var(--e4); }
    .filtres label { display: block; font-size: var(--t-xs); font-weight: 600;
                     color: var(--texte-2); margin-bottom: 2px; }
    .filtres select, .filtres input { min-height: var(--cible-min); font-size: var(--t-sm); width: auto; }
    .filtres .rech { flex: 1 1 240px; }
    .filtres .rech input { width: 100%; }
    .btn-raz { min-height: var(--cible-min); padding: 0 var(--e3); font-size: var(--t-sm);
               border: 1px solid var(--bordure-forte); background: var(--surface);
               color: var(--texte); border-radius: var(--r-sm); }

    /* ---- Liste de prospects ---- */
    .rang { display: grid; gap: var(--e1) var(--e3); align-items: center;
            grid-template-columns: 1fr auto; width: 100%; text-align: left;
            background: var(--surface); border: 1px solid var(--bordure);
            border-left: 3px solid var(--bordure-forte);
            border-radius: var(--r-sm); padding: var(--e3) var(--e4);
            margin-bottom: var(--e2); cursor: pointer; }
    .rang:hover { background: var(--surface-2); }
    .rang.du     { border-left-color: var(--alerte); }
    .rang.retard { border-left-color: var(--danger); }
    .rang .nom { font-weight: 600; }
    .rang .sous { font-size: var(--t-sm); color: var(--texte-2); }
    .rang .droite { text-align: right; font-size: var(--t-sm); color: var(--texte-2); white-space: nowrap; }
    .rang .echeance { font-weight: 600; }
    .reporter { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2);
      margin: var(--e3) 0; font-size: var(--t-sm); color: var(--texte-2); }
    .reporter button { min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--bordure);
      background: var(--surface-2); color: var(--texte); font-weight: 600; cursor: pointer; }
    .reporter button:hover { border-color: var(--accent, var(--alerte)); }
    .reporter input { min-height: 34px; width: auto; }
    .reporter .annuler { color: var(--danger); }
    .rang .quoi { color: var(--texte); display: inline-block; max-width: 34ch; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    .rang .echeance.retard { color: var(--danger); }
    .rang .echeance.du { color: var(--alerte); }
    @media (max-width: 640px) {
      .rang { grid-template-columns: 1fr; }
      .rang .droite { text-align: left; white-space: normal; }
    }
    .rang { cursor: pointer; }
    .rang .reporter { grid-column: 1 / -1; margin: var(--e1) 0 0; padding-top: var(--e2);
      border-top: 1px solid var(--bordure); cursor: default; }
    .kpi.plustard { border-top-color: var(--info); }

    .etat-pastille { display: inline-flex; align-items: center; gap: var(--e1);
                     font-size: var(--t-xs); }
    .etat-pastille i { width: 8px; height: 8px; border-radius: 50%;
                       background: var(--texte-3); flex-shrink: 0; }
    .marque-locale { font-size: 0.6875rem; font-weight: 600; border-radius: var(--r-full);
                     padding: 1px var(--e2); background: var(--surface-3); color: var(--texte-2); }

    .vide, .chargement, .erreur-bloc {
      padding: var(--e6) var(--e4); text-align: center; color: var(--texte-2);
      border: 1px dashed var(--bordure); border-radius: var(--r-md); }
    .erreur-bloc { border-style: solid; border-color: var(--danger);
                   background: var(--danger-doux); color: var(--danger); text-align: left; }

    .groupe-t { margin-bottom: var(--e5); }
    .groupe-t h3 { font-size: var(--t-xs); font-weight: 700; text-transform: uppercase;
                   letter-spacing: 0.05em; color: var(--texte-2); margin-bottom: var(--e2);
                   display: flex; gap: var(--e2); align-items: center; }
    .groupe-t h3 .nb { color: var(--texte-3); font-weight: 500; }

    /* ---- Fiche ---- */
    #fond { position: fixed; inset: 0; background: rgba(10,10,12,0.45); display: none;
            justify-content: flex-end; z-index: 60; }
    #fond[data-ouvert] { display: flex; }
    #fiche { background: var(--surface); width: min(560px, 100%); height: 100dvh;
             overflow-y: auto; padding: var(--e5); box-shadow: var(--ombre-3); }
    #fiche .tete { display: flex; align-items: flex-start; gap: var(--e3); }
    #fiche h2 { font-size: var(--t-xl); }
    #fiche .fermer { margin-left: auto; }
    .f-carte { border: 1px solid var(--bordure); border-radius: 12px; padding: var(--e3); margin-top: var(--e3); background: var(--surface-2); }
    .f-lbl { display: block; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .05em; color: var(--texte-3); margin-bottom: 4px; font-weight: 600; }
    .f-statut { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--e3); align-items: start; }
    .f-statut b { font-size: var(--t-sm); }
    .f-statut .etat-ligne { flex-wrap: nowrap; }
    .f-statut #f-etat-contact { max-width: 100%; min-width: 0; }
    .f-prochaine { border-left: 4px solid var(--info); }
    .f-prochaine.retard { border-left-color: var(--danger); }
    .f-prochaine.retard .f-quand b { color: var(--danger); }
    .f-quoi { font-weight: 700; }
    .f-quand { font-size: var(--t-sm); color: var(--texte-2); margin-top: 2px; }
    .f-prochaine .reporter { margin: var(--e3) 0 0; padding-top: var(--e3); border-top: 1px solid var(--bordure); }
    #fiche .rapides { margin-top: var(--e3); }
    .f-notes { font-size: var(--t-sm); line-height: 1.55; background: var(--surface-2); border-left: 3px solid var(--bordure-forte);
      border-radius: 8px; padding: var(--e3); white-space: normal; overflow-wrap: anywhere; }
    .f-notes p { margin: 0 0 .5em; }
    .rapides { display: flex; flex-wrap: wrap; gap: var(--e2); margin: var(--e4) 0; }
    .rapides a, .rapides button {
      min-height: var(--cible); padding: 0 var(--e3); font-size: var(--t-sm);
      border: 1px solid var(--bordure-forte); border-radius: var(--r-sm);
      background: var(--surface); color: var(--texte); text-decoration: none;
      display: inline-flex; align-items: center; gap: var(--e2); }
    .rapides .primaire { background: var(--accent); border-color: var(--accent);
                         color: var(--sur-accent); font-weight: 600; }
    .bloc { border-top: 1px solid var(--bordure); padding-top: var(--e4); margin-top: var(--e4); }
    .bloc h3 { font-size: var(--t-sm); margin-bottom: var(--e3); }
    .paires { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--e3); }
    .paires div span { display: block; font-size: var(--t-xs); color: var(--texte-2); }
    .paires div b { font-weight: 600; }
    .chrono { display: flex; flex-direction: column; gap: var(--e3);
              border-left: 2px solid var(--bordure); padding-left: var(--e4); }
    .evt { position: relative; font-size: var(--t-sm); }
    .evt::before { content: ''; position: absolute; left: calc(-1 * var(--e4) - 5px); top: 6px;
                   width: 8px; height: 8px; border-radius: 50%; background: var(--bordure-forte); }
    .evt .q { font-weight: 600; }
    .evt .d { color: var(--texte-3); font-size: var(--t-xs); }

    /* ---- Saisie rapide d'une interaction ---- */
    #saisie { display: none; flex-direction: column; gap: var(--e3); margin-top: var(--e3); }
    #saisie[data-ouvert] { display: flex; }
    #saisie .ligne { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: flex-end; }
    #saisie select, #saisie input { min-height: var(--cible-min); font-size: var(--t-sm); }
    #saisie .note { flex: 1 1 100%; }
    .msg { font-size: var(--t-sm); min-height: 1.3em; }
    .msg.ok { color: var(--ok); } .msg.ko { color: var(--danger); }

    /* ---- Tournées ---- */
    .secteur { background: var(--surface-2); border: 1px solid var(--bordure);
               border-radius: var(--r-md); padding: var(--e3); margin-bottom: var(--e3); }
    .secteur h3 { font-size: var(--t-sm); display: flex; gap: var(--e2); align-items: center;
                  margin-bottom: var(--e2); }
    .secteur h3 .nb { margin-left: auto; color: var(--texte-3); font-weight: 500; font-size: var(--t-xs); }
    .arret { display: flex; align-items: center; gap: var(--e2); background: var(--surface);
             border: 1px solid var(--bordure); border-radius: var(--r-sm);
             padding: var(--e2) var(--e3); margin-bottom: var(--e1); font-size: var(--t-sm); }
    .arret .poignee { cursor: grab; color: var(--texte-3); }
    .arret .ville { color: var(--texte-2); font-size: var(--t-xs); }
    .arret .fin { margin-left: auto; display: flex; gap: var(--e2); }
    .arret .fin a, .arret .fin button { min-height: 28px; padding: 0 var(--e2); font-size: var(--t-xs);
      border: 1px solid var(--bordure); border-radius: var(--r-sm);
      background: var(--surface); color: var(--texte); text-decoration: none;
      display: inline-flex; align-items: center; }
    .arret.faite { opacity: 0.55; }
    .arret.faite .nom { text-decoration: line-through; }

    @media print {
      .tabs, .filtres, .sync, .kpi-grid, .rapides, #saisie { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="large">
    <div class="tabs" id="tabs" role="tablist">
      <button data-vue="aujourdhui" class="actif">Aujourd'hui</button>
      <button data-vue="prospects">Prospects</button>
      <button data-vue="tournees">Tournées</button>
      <button data-vue="reporting">Reporting</button>
    </div>

    <div class="sync" id="sync" data-etat="ok">Chargement…</div>

    <!-- ============ AUJOURD'HUI ============ -->
    <div class="vue" id="vue-aujourdhui">
      <div class="kpi-grid" id="kpis"></div>
      <div id="listes-jour"></div>
    </div>

    <!-- ============ PROSPECTS ============ -->
    <div class="vue" id="vue-prospects" style="display:none">
      <div class="filtres" id="filtres">
        <div class="rech">
          <label for="f-q">Rechercher</label>
          <input type="search" id="f-q" placeholder="Établissement, contact, ville…">
        </div>
        <div><label for="f-etat">Statut</label><select id="f-etat"><option value="">Tous</option></select></div>
        <div><label for="f-com">Commercial</label><select id="f-com"><option value="">Tous</option></select></div>
        <div><label for="f-ville">Ville</label><select id="f-ville"><option value="">Toutes</option></select></div>
        <div><label for="f-type">Catégorie</label><select id="f-type"><option value="">Toutes</option></select></div>
        <div><label for="f-tri">Tri</label><select id="f-tri">
          <option value="nom">Nom</option>
          <option value="echeance">Échéance</option>
          <option value="ville">Ville</option>
        </select></div>
        <button class="btn-raz" id="btn-raz">Réinitialiser</button>
      </div>
      <p id="compte" class="carte-soustitre" style="margin-bottom:var(--e3)"></p>
      <div id="liste-prospects"></div>
      <div style="text-align:center;margin-top:var(--e4)">
        <button class="secondary" id="btn-plus" style="display:none">Afficher 50 de plus</button>
      </div>
    </div>

    <!-- ============ TOURNÉES ============ -->
    <div class="vue" id="vue-tournees" style="display:none">
      <div class="filtres">
        <div><label for="t-date">Date</label><input type="date" id="t-date"></div>
        <div><label for="t-com">Commercial</label><select id="t-com"><option value="">—</option></select></div>
        <div><label for="t-ville">Secteur</label><select id="t-ville"><option value="">Tous</option></select></div>
        <button class="btn-raz" id="t-vider">Vider la sélection</button>
      </div>
      <p class="carte-soustitre" style="margin-bottom:var(--e3)">
        Les prospects sont regroupés par commune. C'est un regroupement géographique,
        pas un calcul d'itinéraire optimal : l'ordre des arrêts reste le vôtre.
      </p>
      <div id="tournee-sel"></div>
      <div id="tournee-dispo"></div>
    </div>

    <div class="vue" id="vue-reporting" style="display:none">
      <div class="rp-grille">
        <form class="rp-carte" id="cr" autocomplete="off">
          <h3>Compte rendu de contact</h3>
          <div class="rp-champ"><label for="cr-q">Prospect</label>
            <input type="text" id="cr-q" list="cr-liste" placeholder="Rechercher un prospect…" required>
            <datalist id="cr-liste"></datalist></div>
          <div class="rp-ligne">
            <div class="rp-champ"><label for="cr-type">Type de contact</label><select id="cr-type"></select></div>
            <div class="rp-champ"><label for="cr-date">Date</label><input type="date" id="cr-date" required></div>
          </div>
          <div class="rp-ligne">
            <div class="rp-champ"><label for="cr-inter">Interlocuteur</label><input type="text" id="cr-inter" placeholder="Nom"></div>
            <div class="rp-champ"><label for="cr-fonction">Fonction</label><input type="text" id="cr-fonction" placeholder="Gérant, chef de bar…"></div>
          </div>
          <div class="rp-champ"><span class="rp-lbl">Résultat</span><div class="rp-puces" id="cr-res"></div></div>
          <div class="rp-ligne">
            <div class="rp-champ"><label for="cr-etat">Nouvel état de contact</label><select id="cr-etat"></select></div>
            <div class="rp-champ"><label for="cr-com">Commercial</label><select id="cr-com"></select></div>
          </div>
          <div class="rp-ligne">
            <div class="rp-champ"><label for="cr-vol">Potentiel / mois</label>
              <span class="rp-duo"><input type="number" id="cr-vol" min="0" placeholder="Volume">
              <select id="cr-unite"><option value="bouteilles">bouteilles</option><option value="fûts">fûts</option></select></span></div>
            <div class="rp-champ"><label for="cr-gamme">Gamme visée</label>
              <select id="cr-gamme"><option value="">—</option><option>Classique</option><option>La Bruguiéroise (GMS)</option><option>Fûts</option><option>Mixte</option></select></div>
          </div>
          <div class="rp-champ"><label for="cr-conc">Concurrents en place</label><input type="text" id="cr-conc" maxlength="200" placeholder="Brasseries déjà référencées"></div>
          <div class="rp-champ"><span class="rp-lbl">Prochaine action</span>
            <div class="rp-ligne">
              <select id="cr-ptype"><option value="">Aucune</option></select>
              <input type="date" id="cr-pdate">
            </div>
            <div class="rp-puces" id="cr-praccourcis">
              <button type="button" data-j="7">1 semaine</button><button type="button" data-j="14">2 semaines</button><button type="button" data-j="30">1 mois</button>
            </div></div>
          <div class="rp-champ"><label for="cr-note">Note</label><textarea id="cr-note" rows="3" maxlength="1500"></textarea></div>
          <div id="cr-retards"></div>
          <button type="submit" class="primary" id="cr-ok">Enregistrer le compte rendu</button>
          <div id="cr-etapes" role="status"></div>
        </form>

        <div class="rp-tableau">
          <div class="filtres">
            <div><label for="rp-per">Période</label><select id="rp-per">
              <option value="semaine">Cette semaine</option><option value="mois" selected>Ce mois</option><option value="libre">Personnalisée</option></select></div>
            <div id="rp-libre" hidden><label for="rp-du">Du</label><input type="date" id="rp-du"></div>
            <div id="rp-libre2" hidden><label for="rp-au">Au</label><input type="date" id="rp-au"></div>
            <div><label for="rp-com">Commercial</label><select id="rp-com"><option value="">Tous</option></select></div>
            <button class="btn-raz" id="rp-csv">Export CSV</button>
          </div>
          <div id="rp-kpis" class="kpi-grid"></div>
          <div id="rp-detail"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="fond" role="dialog" aria-modal="true" aria-labelledby="fiche-titre"><div id="fiche"></div></div>

  <script>
  // ==========================================================================
  //  Source de référence : EasyBeer.
  //  Les fiches saisies dans l'ancien module local sont conservées et
  //  affichées, marquées « locale » tant qu'elles ne sont pas rapprochées.
  //  Aucun email ni message n'est envoyé automatiquement.
  // ==========================================================================
  let ref = { etatsContact: [], typesAction: [], etatsAction: [], utilisateurs: [] };
  let prospects = [];          // EasyBeer
  let actions = [];            // EasyBeer
  let erreurs = { prospects: null, actions: null };
  let synchroniseLe = null;
  let vue = 'aujourdhui';
  let limite = 50;

  // Chaque magasin redessine la vue qui l'affiche : sans cela, ajouter un
  // arrêt ou modifier une fiche locale ne se voyait qu'au rechargement.
  const locales = creerMagasin('prospects', { surChangement: () => rendre() });
  // « Recontacter sous N jours » : report décidé en interne, partagé entre
  // les postes. Il prime sur l'action EasyBeer et sort la fiche des
  // « Non transformés » ; rien n'est écrit dans EasyBeer.
  const reports = creerMagasin('reports', { surChangement: () => rendre() });
  const reportings = creerMagasin('reportings', { surChangement: () => { if (vue === 'reporting') rendreTableau(); } });
  const cleDe = p => p.source === 'locale' ? `L${p.cleLocale}` : `E${p.idClient}`;
  const reportDe = p => reports.tout().find(r => r.id === cleDe(p));
  const tournee = creerMagasin('visites', {
    surChangement: () => { if (vue === 'tournees') rendreTournees(); } });

  const AUJ = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  const JOUR = 86400000;
  const fmtD = t => t ? new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' }) : '—';
  const jours = t => Math.round((t - AUJ()) / JOUR);
  const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const echap = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

  // Codes réels des référentiels EasyBeer (/referentiel/action-client/etats et
  // /referentiel/client/etats-contact) : une action close est FAIT ou
  // NE_PAS_FAIRE ; un prospect est sorti du cycle une fois validé, en échec,
  // non qualifié ou à ne pas contacter.
  const ACTIONS_CLOSES = new Set(['FAIT', 'NE_PAS_FAIRE']);
  const CONTACTS_CLOS = new Set(['VALIDE', 'ECHEC', 'NON_QUALIFIE', 'NE_PAS_CONTACTER']);
  const estClos = p => p.source === 'locale'
    ? ['gagne', 'perdu'].includes(p.statutLocal)
    : CONTACTS_CLOS.has(p.etatContact ?? '');
  const villeDe = adr => (String(adr ?? '').match(/\b\d{5}\s+([^,]+)$/) ?? [])[1]?.trim() ?? '';

  // --- Filtres conservés au retour depuis une fiche (et partageables) -------
  const CLE_F = 'lgdm-prospection-filtres';
  function lireFiltres() {
    const url = new URLSearchParams(location.hash.slice(1));
    if ([...url.keys()].length) return Object.fromEntries(url);
    try { return JSON.parse(sessionStorage.getItem(CLE_F)) ?? {}; } catch { return {}; }
  }
  function ecrireFiltres(f) {
    const propres = Object.fromEntries(Object.entries(f).filter(([, v]) => v));
    try { sessionStorage.setItem(CLE_F, JSON.stringify(propres)); } catch {}
    const h = new URLSearchParams(propres).toString();
    history.replaceState(null, '', h ? '#' + h : location.pathname);
  }
  const filtresCourants = () => ({
    q: document.getElementById('f-q').value.trim(),
    etat: document.getElementById('f-etat').value,
    com: document.getElementById('f-com').value,
    ville: document.getElementById('f-ville').value,
    type: document.getElementById('f-type').value,
    tri: document.getElementById('f-tri').value,
  });

  // --- Chargement ----------------------------------------------------------
  async function charger() {
    majSync('chargement');
    const [r1, r2, r3] = await Promise.allSettled([
      fetch('/api/prospection/referentiels').then(verifier),
      fetch('/api/prospection/prospects').then(verifier),
      fetch('/api/prospection/actions').then(verifier),
    ]);
    if (r1.status === 'fulfilled') ref = r1.value;
    if (r2.status === 'fulfilled') {
      prospects = r2.value.prospects ?? [];
      synchroniseLe = r2.value.synchroniseLe ?? Date.now();
      erreurs.prospects = null;
    } else erreurs.prospects = r2.reason.message;
    if (r3.status === 'fulfilled') { actions = r3.value.actions ?? []; erreurs.actions = null; }
    else erreurs.actions = r3.reason.message;

    remplirSelects();
    appliquerFiltresSauvegardes();
    majSync();
    rendre();
  }
  async function verifier(r) {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error ?? `HTTP ${r.status}`);
    return d;
  }

  function majSync(etat) {
    const el = document.getElementById('sync');
    if (etat === 'chargement') {
      el.dataset.etat = 'ok';
      el.innerHTML = '<span class="loader"></span> Lecture de la prospection EasyBeer…';
      return;
    }
    // Trois situations distinctes, et non deux : tout va bien, le planning
    // n'est pas lisible mais les prospects le sont, ou EasyBeer est en panne.
    const ancien = synchroniseLe && Date.now() - synchroniseLe > 30 * 60000;
    let corps;
    if (erreurs.prospects) {
      el.dataset.etat = 'erreur';
      corps = `${ico('alerte')} EasyBeer indisponible — ${erreurs.prospects}. `
        + `Les fiches locales restent consultables et modifiables.`;
    } else if (erreurs.actions) {
      el.dataset.etat = 'ancien';
      corps = `${ico('alerte')} ${prospects.length} prospects lus. `
        + `<b>Le planning des actions n'est pas lisible</b> — les échéances et relances `
        + `ne peuvent pas être affichées (EasyBeer renvoie une erreur sur cette liste).`;
    } else {
      el.dataset.etat = ancien ? 'ancien' : 'ok';
      const ouvertes = actions.filter(a => !ACTIONS_CLOSES.has(a.etat)).length;
      corps = `${ico('check')} ${prospects.length} prospects EasyBeer · ${ouvertes} action(s) ouverte(s)`
        + (locales.tout().length ? ` · ${locales.tout().length} fiche(s) locale(s)` : '')
        + ` · synchronisé ${synchroniseLe ? 'le ' + new Date(synchroniseLe).toLocaleString('fr-FR') : ''}`;
    }
    el.innerHTML = corps + '<button id="btn-resync">Actualiser</button>';
    document.getElementById('btn-resync').addEventListener('click', charger);
  }

  // --- Modèle unifié : EasyBeer + fiches locales ---------------------------
  function tous() {
    const ext = prospects.map(p => ({ ...p, source: 'easybeer' }));
    const loc = locales.tout().map(l => ({
      idClient: null, source: 'locale', cleLocale: l.id, numero: '',
      nom: l.nom ?? '', ville: l.ville ?? '', adresse: '', type: l.type ?? '',
      commercial: l.resp ?? '', etatContact: null, statutLocal: l.statut ?? '',
      etatContactLibelle: ({ contacter:'À contacter', premier:'Premier contact', relancer:'À relancer',
        interesse:'Intéressé', rdv:'RDV', proposition:'Proposition', negociation:'Négociation',
        gagne:'Gagné', perdu:'Perdu' })[l.statut] ?? '',
      contact: { nom: l.contact ?? '', telephone: l.tel ?? '', email: l.email ?? '' },
      note: l.note ?? '', nombreActions: (l.historique ?? []).length,
      prochaine: l.prochaine ?? null,
    }));
    return [...ext, ...loc];
  }

  // Les actions ouvertes portent aussi sur des clients (relances commerciales).
  // L'agenda du jour les inclut ; la liste Prospects reste réservée aux prospects.
  function clientsDesActions() {
    const connus = new Set(prospects.map(p => p.idClient));
    const parId = new Map();
    for (const a of actions) {
      if (!a.idClient || connus.has(a.idClient) || parId.has(a.idClient)) continue;
      if (ACTIONS_CLOSES.has(a.etat) || !a.date) continue;
      parId.set(a.idClient, {
        idClient: a.idClient, source: 'client', numero: '',
        nom: a.nomClient || 'Client', ville: villeDe(a.adresse), adresse: a.adresse ?? '',
        type: a.typeClient ?? '', tournee: a.tournee ?? '', commercial: a.responsable ?? '',
        etatContact: null, etatContactCouleur: null,
        etatContactLibelle: ({ CLIENT: 'Client', PROSPECT: 'Prospect' })[a.etatClient] ?? '',
        contact: { nom: '', telephone: a.telephone ?? '', email: '' },
        note: '', nombreActions: 0,
      });
    }
    return [...parId.values()];
  }
  // État changé depuis la fiche d'un client (hors liste des prospects).
  const etatsClients = new Map();
  const agenda = () => [...tous(), ...clientsDesActions().map(c => ({ ...c, ...(etatsClients.get(c.idClient) ?? {}) }))];

  // Prochaine action d'un prospect : la plus proche parmi celles à faire
  function prochaineDe(p) {
    const r = reportDe(p);
    if (r) return { date: r.date, libelle: 'Recontacter', report: true };
    if (p.source === 'locale') {
      return p.prochaine?.date
        ? { date: new Date(p.prochaine.date + 'T12:00').getTime(), libelle: p.prochaine.quoi ?? 'Relance' }
        : null;
    }
    const aFaire = actions.filter(a => a.idClient === p.idClient && !ACTIONS_CLOSES.has(a.etat) && a.date);
    if (!aFaire.length) return null;
    const a = aFaire.sort((x, y) => x.date - y.date)[0];
    return { date: a.date, libelle: a.libelle || a.typeLibelle || 'Action', idAction: a.idAction };
  }

  // --- Rendu ---------------------------------------------------------------
  function rendre() {
    if (vue === 'aujourdhui') rendreJour();
    if (vue === 'prospects') rendreListe();
    if (vue === 'tournees') rendreTournees();
    if (vue === 'reporting') rendreReporting();
  }

  // Non transformés : prospects en échec ou à ne pas contacter. Rangés à part
  // pour ne plus encombrer les relances, sans rien modifier dans EasyBeer.
  const PERDUS = new Set(['ECHEC', 'NE_PAS_CONTACTER']);
  const estPerdu = p => reportDe(p) ? false : p.source !== 'locale' ? PERDUS.has(p.etatContact ?? '') : p.statutLocal === 'perdu';

  function categories() {
    const tout = agenda().map(p => ({ p, pr: prochaineDe(p) }));
    const liste = tout.filter(x => !estPerdu(x.p));
    const parDate = (a, b) => a.pr.date - b.pr.date;
    return {
      // Retards : les plus récents d'abord — une relance d'hier a plus de
      // chances d'être encore utile qu'une relance oubliée depuis un an.
      retard: liste.filter(x => x.pr && x.pr.date < AUJ()).sort((a, b) => parDate(b, a)),
      jour:   liste.filter(x => x.pr && x.pr.date >= AUJ() && x.pr.date < AUJ() + JOUR).sort(parDate),
      visite: liste.filter(x => x.pr && x.pr.date >= AUJ() && x.pr.date < AUJ() + 8 * JOUR).sort(parDate),
      plustard: liste.filter(x => x.pr && x.pr.date >= AUJ() + 8 * JOUR).sort(parDate),
      sans:   liste.filter(x => !x.pr && x.p.source !== 'client' && !estClos(x.p)),
      perdus: tout.filter(x => estPerdu(x.p)).sort((a, b) => a.p.nom.localeCompare(b.p.nom, 'fr')),
    };
  }

  // Catégorie isolée par un clic sur un compteur (re-clic : tout afficher).
  let catActive = null;

  function rendreJour() {
    // Sans le planning, « 0 relance en retard » serait un mensonge : on dit
    // ce qu'on ne sait pas plutôt que d'afficher des compteurs rassurants.
    if (erreurs.actions && !actions.length) {
      document.getElementById('kpis').innerHTML = '';
      document.getElementById('listes-jour').innerHTML = `
        <div class="erreur-bloc">${ico('alerte')}
          <b>Planning des actions indisponible.</b><br>
          Les relances et échéances viennent des actions commerciales EasyBeer,
          dont la liste renvoie une erreur serveur. Les compteurs ne sont pas
          affichés pour ne pas donner une fausse impression d'agenda vide.<br>
          <span style="font-size:var(--t-sm)">Détail : ${erreurs.actions}</span><br><br>
          Les onglets <b>Prospects</b> et <b>Tournées</b> restent pleinement utilisables,
          et vous pouvez enregistrer des interactions depuis chaque fiche.
        </div>`;
      return;
    }
    const c = categories();
    const k = [
      ['retard', 'Relances en retard', c.retard.length],
      ['jour', "À contacter aujourd'hui", c.jour.length],
      ['visite', 'Prévu sous 7 jours', c.visite.length],
      ['plustard', 'Plus tard', c.plustard.length],
      ['', 'Sans prochaine action', c.sans.length],
      ['perdus', 'Non transformés', c.perdus.length],
    ];
    document.getElementById('kpis').innerHTML = k.map(([cl, l, v]) =>
      `<button class="kpi ${cl} ${catActive === (cl || 'sans') ? 'actif' : ''}" data-cat="${cl || 'sans'}"
         aria-pressed="${catActive === (cl || 'sans')}">
         <span class="lbl">${l}</span><span class="val">${v}</span></button>`).join('');
    document.querySelectorAll('.kpi').forEach(b => b.addEventListener('click', () => {
      catActive = catActive === b.dataset.cat ? null : b.dataset.cat;
      rendreJour();
    }));

    const max = catActive ? 1000 : 40;
    const bloc = (id, titre, liste, classe) => (!liste.length || (catActive && catActive !== id)) ? '' : `
      <div class="groupe-t" id="bloc-${id}">
        <h3>${titre} <span class="nb">(${liste.length})</span></h3>
        ${liste.slice(0, max).map(x => rang(x.p, x.pr, classe)).join('')}
        ${liste.length > max ? `<p class="carte-soustitre">+${liste.length - max} autres — voir l'onglet Prospects</p>` : ''}
      </div>`;

    // Actions ouvertes sans fiche rattachée (tâches générales) : sans elles,
    // elles n'apparaîtraient nulle part.
    const orphelines = actions.filter(a => !a.idClient && !ACTIONS_CLOSES.has(a.etat))
      .sort((a, b) => (b.date ?? 0) - (a.date ?? 0));
    const blocOrph = !orphelines.length ? '' : `
      <div class="groupe-t" id="bloc-orphelines">
        <h3>Actions sans fiche rattachée <span class="nb">(${orphelines.length})</span></h3>
        ${orphelines.map(a => {
          const j = a.date ? jours(a.date) : null;
          return `<div class="rang ${j !== null && j < 0 ? 'retard' : ''}" style="cursor:default">
            <span><span class="nom">${echap(a.libelle || a.typeLibelle || 'Action')}</span>
              <span class="sous">${echap(a.description || '—')}</span></span>
            <span class="droite">${j === null ? '' : j < 0 ? `<span class="echeance retard">${-j} j de retard</span>`
              : `<span class="echeance">${fmtD(a.date)}</span>`}<br>${echap(a.responsable)}</span>
          </div>`; }).join('')}
      </div>`;

    const html = bloc('retard', 'Relances en retard', c.retard, 'retard')
      + bloc('jour', "À contacter aujourd'hui", c.jour, 'du')
      + bloc('visite', 'Prévu sous 7 jours', catActive ? c.visite : c.visite.filter(x => x.pr.date >= AUJ() + JOUR), '')
      + bloc('plustard', 'À recontacter plus tard', c.plustard, '')
      + (catActive ? '' : blocOrph)
      + bloc('sans', 'Prospects actifs sans prochaine action', c.sans, '')
      + bloc('perdus', 'Non transformés — échec ou ne pas contacter', c.perdus, 'perdu');
    const bandeauFiltre = catActive ? `<p class="filtre-actif">Catégorie isolée —
      <button id="tout-voir">Tout afficher</button></p>` : '';
    document.getElementById('listes-jour').innerHTML = bandeauFiltre + (html
      || (catActive ? '<div class="vide"><p>Aucune fiche dans cette catégorie.</p></div>' : '')
      || (erreurs.prospects
          ? `<div class="erreur-bloc">${ico('alerte')} Prospection EasyBeer indisponible : ${erreurs.prospects}</div>`
          : `<div class="vide">${ico('check')}<p>Rien à traiter aujourd'hui.</p></div>`));
    document.getElementById('tout-voir')?.addEventListener('click', () => { catActive = null; rendreJour(); });
    brancherRangs();
  }

  function rang(p, pr, classe) {
    const j = pr ? jours(pr.date) : null;
    const quoi = pr?.libelle ? `<span class="quoi" title="${echap(pr.libelle)}">${echap(pr.libelle)}</span> · ` : '';
    const ech = !pr ? '<span class="echeance">aucune action prévue</span>'
      : quoi + (j < 0 ? `<span class="echeance retard">${-j} j de retard</span>`
      : j === 0 ? '<span class="echeance du">aujourd’hui</span>'
      : `<span class="echeance">dans ${j} j</span>`);
    const cle = p.source === 'locale' ? `L${p.cleLocale}` : `E${p.idClient}`;
    return `<div class="rang ${classe ?? ''}" data-cle="${cle}" role="button" tabindex="0">
      <span>
        <span class="nom">${p.nom}</span>
        ${p.source === 'locale' ? '<span class="marque-locale">locale</span>' : ''}
        <span class="sous">${[p.ville, p.type, p.contact.nom].filter(Boolean).join(' · ') || '—'}</span>
      </span>
      <span class="droite">
        ${ech}<br>
        <span class="etat-pastille"><i style="background:${p.etatContactCouleur ?? 'var(--texte-3)'}"></i>${p.etatContactLibelle || 'statut inconnu'}</span>
        ${p.commercial ? ' · ' + p.commercial : ''}
      </span>
    </div>`;
  }

  // Boutons « Recontacter » directement sur la ligne, comme sur « Y aller ».
  function barreReport(p, cle) {
    const r = reportDe(p);
    return `<span class="reporter">
      <span>Recontacter :</span>
      <button data-rep="7" data-cle="${cle}">dans 1 semaine</button>
      <button data-rep="14" data-cle="${cle}">dans 2 semaines</button>
      <button data-rep="30" data-cle="${cle}">dans 1 mois</button>
      <input type="date" data-cle="${cle}" aria-label="Recontacter le"
        value="${r ? new Date(r.date).toLocaleDateString('sv-SE') : ''}">
      ${r ? `<button data-rep="0" data-cle="${cle}" class="annuler">Annuler</button>` : ''}
    </span>`;
  }
  async function reporterCle(cle, date) {
    const p = trouver(cle); if (!p) return;
    if (date === null) await reports.supprimer(cle);
    else await reports.enregistrer({ id: cle, nom: p.nom, date, le: Date.now() });
  }
  function brancherRangs() {
    document.querySelectorAll('.rang[data-cle]').forEach(b => {
      b.addEventListener('click', e => { if (!e.target.closest('.reporter')) ouvrirFiche(b.dataset.cle); });
      b.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === b) ouvrirFiche(b.dataset.cle); });
    });
    document.querySelectorAll('.rang [data-rep]').forEach(b => b.addEventListener('click', () => {
      const n = +b.dataset.rep;
      reporterCle(b.dataset.cle, n ? AUJ() + n * JOUR : null);
    }));
    document.querySelectorAll('.rang .reporter input').forEach(i => i.addEventListener('change', () => {
      if (i.value) reporterCle(i.dataset.cle, new Date(i.value + 'T09:00').getTime());
    }));
  }

  // --- Liste filtrée -------------------------------------------------------
  function filtrer() {
    const f = filtresCourants();
    ecrireFiltres(f);
    const q = norm(f.q);
    let l = tous().map(p => ({ p, pr: prochaineDe(p) }));
    if (q) l = l.filter(({ p }) => norm(`${p.nom} ${p.ville} ${p.contact.nom}`).includes(q));
    if (f.etat) l = l.filter(({ p }) => p.etatContact === f.etat);
    if (f.com) l = l.filter(({ p }) => p.commercial === f.com);
    if (f.ville) l = l.filter(({ p }) => p.ville === f.ville);
    if (f.type) l = l.filter(({ p }) => p.type === f.type);
    const cmp = { nom: (a,b) => a.p.nom.localeCompare(b.p.nom,'fr'),
      ville: (a,b) => (a.p.ville||'').localeCompare(b.p.ville||'','fr') || a.p.nom.localeCompare(b.p.nom,'fr'),
      echeance: (a,b) => (a.pr?.date ?? Infinity) - (b.pr?.date ?? Infinity) };
    return l.sort(cmp[f.tri] ?? cmp.nom);
  }

  function rendreListe() {
    const l = filtrer();
    const el = document.getElementById('liste-prospects');
    document.getElementById('compte').textContent =
      `${l.length} prospect(s) — ${prospects.length} depuis EasyBeer, ${locales.tout().length} fiche(s) locale(s)`;
    if (erreurs.prospects && !prospects.length) {
      el.innerHTML = `<div class="erreur-bloc">${ico('alerte')} ${erreurs.prospects}<br>
        Les fiches locales restent utilisables ci-dessous.</div>`;
    } else el.innerHTML = '';
    el.innerHTML += l.length
      ? l.slice(0, limite).map(x => rang(x.p, x.pr, x.pr && x.pr.date < AUJ() ? 'retard' : '')).join('')
      : `<div class="vide"><p>Aucun prospect ne correspond à ces critères.</p></div>`;
    const plus = document.getElementById('btn-plus');
    plus.style.display = l.length > limite ? 'inline-flex' : 'none';
    brancherRangs();
  }

  // --- Fiche ---------------------------------------------------------------
  let ficheCle = null;
  function trouver(cle) {
    return agenda().find(p => (p.source === 'locale' ? `L${p.cleLocale}` : `E${p.idClient}`) === cle);
  }

  async function ouvrirFiche(cle, confirmation) {
    ficheCle = cle;
    const p = trouver(cle); if (!p) return;
    const pr = prochaineDe(p);
    const hist = p.source !== 'locale'
      ? actions.filter(a => a.idClient === p.idClient).sort((a, b) => (b.date ?? 0) - (a.date ?? 0))
      : (locales.tout().find(l => l.id === p.cleLocale)?.historique ?? [])
          .map(h => ({ date: h.t, libelle: h.type, description: h.note, responsable: h.qui }));

    const tel = p.contact.telephone;
    const maps = p.adresse || `${p.nom} ${p.ville}`;
    document.getElementById('fiche').innerHTML = `
      <div class="tete">
        <div>
          <h2 id="fiche-titre">${p.nom}</h2>
          <p class="carte-soustitre">
            ${[p.type, p.ville, p.numero].filter(Boolean).join(' · ')}
            ${p.source === 'locale' ? ' · <span class="marque-locale">fiche locale, non liée à EasyBeer</span>' : ''}
          </p>
        </div>

        ${tel ? `<a href="tel:${tel}">${ico('telephone')} Appeler</a>` : ''}
        ${p.contact.email ? `<a href="mailto:${p.contact.email}">${ico('mail')} Email</a>` : ''}

           target="_blank" rel="noopener">${ico('carte')} Itinéraire</a>

      <div class="bloc">
        <h3>Coordonnées</h3>
        <div class="paires">
          <div><span>Contact</span><b>${p.contact.nom || '—'}</b></div>
          <div><span>Téléphone</span><b>${tel ? `<a href="tel:${tel}">${tel}</a>` : '—'}</b></div>
          <div><span>Email</span><b>${p.contact.email ? `<a href="mailto:${p.contact.email}">${p.contact.email}</a>` : '—'}</b></div>

      <div class="bloc">
        <h3>Historique (${hist.length})</h3>
        ${hist.length ? `<div class="chrono">${hist.slice(0, 30).map(h => `

            <div class="q">${echap(h.libelle || h.typeLibelle || 'Action')}</div>
            <div class="d">${fmtD(h.date)}${h.responsable ? ' · ' + echap(h.responsable) : ''}${h.etatLibelle ? ' · ' + echap(h.etatLibelle) : ''}</div>
            ${h.description ? `<div>${echap(h.description)}</div>` : ''}
          </div>`).join('')}</div>`
          : '<p class="carte-soustitre">Aucune interaction enregistrée.</p>'}

    if (confirmation) {
      const p2 = document.createElement('p');
      p2.className = 'msg ok'; p2.setAttribute('role', 'status');

    document.getElementById('b-cr')?.addEventListener('click', () => { fermerFiche(); ouvrirCompteRendu(p); });
    document.getElementById('f-etat-contact')?.addEventListener('change', e => changerEtat(p, e.target));
    const reporter = async date => {
      if (date === null) await reports.supprimer(cleDe(p));
      else await reports.enregistrer({ id: cleDe(p), nom: p.nom, date, le: Date.now() });
      ouvrirFiche(cle, date === null ? 'Report annulé.' : `À recontacter le ${fmtD(date)}.`);
    };
    document.querySelectorAll('[data-report]').forEach(b => b.addEventListener('click', () => {
      const n = +b.dataset.report;
      reporter(n ? AUJ() + n * JOUR : null);
    }));

      if (e.target.value) reporter(new Date(e.target.value + 'T09:00').getTime());
    });

    if (p.idClient) chargerDerniereCommande(p.idClient);
    else document.getElementById('bloc-commande').innerHTML =
      '<h3>EasyBeer</h3><p class="carte-soustitre">Fiche non liée : aucune donnée commerciale disponible.</p>';

  async function chargerDerniereCommande(id) {
    const el = document.getElementById('bloc-commande');
    el.innerHTML = '<h3>EasyBeer</h3><p class="carte-soustitre"><span class="loader"></span> Lecture…</p>';
    try {
      const d = await verifier(await fetch('/api/prospection/derniere-commande/' + id));
      el.innerHTML = '<h3>EasyBeer</h3>' + (d.idCommande
        ? `<div class="paires">
             <div><span>Dernière commande</span><b>${fmtD(d.date)}</b></div>
             ${d.numero ? `<div><span>N°</span><b>${d.numero}</b></div>` : ''}
             ${d.totalHT ? `<div><span>Montant HT</span><b>${Math.round(d.totalHT)} €</b></div>` : ''}
           </div>`
        : '<p class="carte-soustitre">Aucune commande enregistrée — prospect jamais converti.</p>');
    } catch (e) {
      el.innerHTML = `<h3>EasyBeer</h3><p class="carte-soustitre" style="color:var(--danger)">
        Donnée indisponible : ${e.message}</p>`;
    }
  }

  async function enregistrer(p) {
    const msg = document.getElementById('s-msg');
    const type = document.getElementById('s-type').value;
    const res = document.getElementById('s-res').value;
    const note = document.getElementById('s-note').value.trim();
    const quand = document.getElementById('s-quand').value;
    msg.className = 'msg'; msg.textContent = 'Enregistrement…';

    if (p.source === 'locale') {
      const l = locales.tout().find(x => x.id === p.cleLocale);
      (l.historique ??= []).unshift({ t: Date.now(), qui: '—', type, note: [res, note].filter(Boolean).join(' — ') });
      l.dernierContact = new Date().toISOString().slice(0, 10);
      if (quand) l.prochaine = { quoi: res, date: quand };
      await locales.enregistrer(l);
      rendre();
      ouvrirFiche(ficheCle, 'Interaction enregistrée sur la fiche locale.');
      return;
    }
    try {
      await verifier(await fetch('/api/prospection/action', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idClient: p.idClient, type,
          libelle: res,
          description: note,
          date: quand ? new Date(quand + 'T09:00').getTime() : Date.now(),
          etat: quand ? 'A_FAIRE' : 'FAIT',
        }),
      }));
      const cle = ficheCle;
      await charger();
      ouvrirFiche(cle, quand
        ? 'Interaction enregistrée dans EasyBeer, prochaine action programmée.'
        : 'Interaction enregistrée dans EasyBeer.');
    } catch (e) {
      msg.className = 'msg ko';
      msg.textContent = 'Échec de l’enregistrement : ' + e.message + ' — rien n’a été écrit.';
    }
  }

  // Changement d'état écrit dans EasyBeer ; en cas d'échec, le sélecteur
  // revient à l'état précédent et rien n'est modifié à l'écran.
  async function changerEtat(p, sel) {
    const avant = p.etatContact ?? '';
    const etat = sel.value; if (!etat) return;
    sel.disabled = true;
    try {
      const d = await verifier(await fetch('/api/prospection/etat-contact', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idClient: p.idClient, etat }),
      }));
      const e = d.etatContact ?? ref.etatsContact.find(x => x.code === etat) ?? {};
      const cible = prospects.find(x => x.idClient === p.idClient);
      const maj = { etatContact: e.code ?? etat, etatContactLibelle: e.libelle ?? '', etatContactCouleur: e.couleur ?? null };
      if (cible) Object.assign(cible, maj); else etatsClients.set(p.idClient, maj);
      rendre();
      ouvrirFiche(ficheCle, d.confirme === false
        ? 'Demande envoyée à EasyBeer, mais l’état relu diffère — vérifiez dans EasyBeer.'
        : `État changé dans EasyBeer : ${e.libelle ?? etat}.`);
    } catch (err) {
      sel.value = avant; sel.disabled = false;
      alert('Changement d’état impossible : ' + err.message + '\n\nRien n’a été modifié.');
    }
  }

  // La conversion est explicite, confirmée, et son résultat est vérifié côté
  // serveur avant d'être annoncé ici.
  async function convertir(p) {
    if (!confirm(`Transformer ${p.nom} en client dans EasyBeer ?\n\n`
      + `Sa fiche, son historique d'actions et ses coordonnées sont conservés. `
      + `Un numéro client remplacera le numéro de prospect ${p.numero}.`)) return;
    const b = document.getElementById('b-convertir');
    b.disabled = true; b.innerHTML = '<span class="loader"></span> Transformation…';
    try {
      const d = await verifier(await fetch('/api/prospection/transformer-en-client', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idClient: p.idClient }),
      }));
      const cle = ficheCle;
      await charger();
      ouvrirFiche(cle, d.dejaClient
        ? `Déjà client dans EasyBeer (${d.numero}) — rien n'a été modifié.`
        : d.confirme
          ? `Transformé en client — numéro ${d.numeroApres}.`
          : `Transformation envoyée à EasyBeer ; le numéro client n'a pas pu être relu.`);
    } catch (e) {
      b.disabled = false; b.innerHTML = 'Transformer en client';
      alert('Transformation impossible : ' + e.message + '\n\nRien n’a été modifié.');
    }
  }

  const fermerFiche = () => { delete document.getElementById('fond').dataset.ouvert; ficheCle = null; };
  document.getElementById('fond').addEventListener('click', e => { if (e.target.id === 'fond') fermerFiche(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerFiche(); });

  // --- Tournées ------------------------------------------------------------
  function rendreTournees() {
    const sel = tournee.tout();
    const selIds = new Set(sel.map(s => s.idClient).filter(Boolean));
    const ville = document.getElementById('t-ville').value;

    document.getElementById('tournee-sel').innerHTML = !sel.length ? '' : `
      <div class="groupe-t"><h3>Arrêts retenus <span class="nb">(${sel.length})</span></h3>
        ${sel.map((s, i) => `<div class="arret" data-id="${s.id}">
          <span class="poignee" title="Glisser pour réordonner">${ico('liste')}</span>
          <span><span class="nom">${i + 1}. ${s.nom}</span>
            <span class="ville">${s.ville ?? ''}${s.note ? ' — ' + s.note : ''}</span></span>
          <span class="fin">
            <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.adresse || s.nom)}"
               target="_blank" rel="noopener">Itinéraire</a>
            <button data-act="fait">${s.derniereVisite ? 'Refaire' : 'Fait'}</button>
            <button data-act="oter">Ôter</button>
          </span></div>`).join('')}
      </div>`;

    const parVille = new Map();
    for (const p of tous()) {
      if (p.source !== 'easybeer' || selIds.has(p.idClient)) continue;
      if (ville && p.ville !== ville) continue;
      const k = p.ville || 'Sans commune';
      if (!parVille.has(k)) parVille.set(k, []);
      parVille.get(k).push(p);
    }
    document.getElementById('tournee-dispo').innerHTML =
      [...parVille.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 20)
        .map(([v, l]) => `<div class="secteur">
          <h3>${v}<span class="nb">${l.length} prospect(s)</span></h3>
          ${l.slice(0, 12).map(p => `<div class="arret">
            <span><span class="nom">${p.nom}</span>
              <span class="ville">${p.etatContactLibelle || ''}</span></span>
            <span class="fin"><button data-ajout="${p.idClient}">Ajouter</button></span></div>`).join('')}
        </div>`).join('') || '<div class="vide"><p>Aucun prospect géolocalisé disponible.</p></div>';

    document.querySelectorAll('[data-ajout]').forEach(b => b.addEventListener('click', () => {
      const p = prospects.find(x => x.idClient === +b.dataset.ajout);
      tournee.enregistrer({
        id: Date.now(), nom: p.nom, idClient: p.idClient, ville: p.ville, adresse: p.adresse,
        note: document.getElementById('t-date').value
          ? 'Tournée du ' + fmtD(new Date(document.getElementById('t-date').value + 'T12:00').getTime()) : 'Prospection',
        prochaine: document.getElementById('t-date').value || null,
        derniereVisite: null, ajouteLe: Date.now(),
      });
    }));
    document.querySelectorAll('.arret [data-act]').forEach(b => b.addEventListener('click', () => {
      const id = b.closest('.arret').dataset.id;
      const s = tournee.tout().find(x => String(x.id) === id); if (!s) return;
      if (b.dataset.act === 'oter') tournee.supprimer(s.id);
      else tournee.enregistrer({ ...s, derniereVisite: new Date().toISOString().slice(0, 10), prochaine: null });
    }));
  }

  // --- Sélecteurs et filtres ----------------------------------------------
  function remplirSelects() {
    const set = (id, valeurs, garde) => {
      const s = document.getElementById(id); const v = s.value;
      s.innerHTML = `<option value="">${garde}</option>` +
        valeurs.map(x => typeof x === 'string'
          ? `<option value="${x}">${x}</option>`
          : `<option value="${x.v}">${x.l}</option>`).join('');
      s.value = v;
    };
    set('f-etat', ref.etatsContact.map(e => ({ v: e.code, l: e.libelle })), 'Tous');
    const coms = [...new Set(prospects.map(p => p.commercial).filter(Boolean))].sort();
    set('f-com', coms, 'Tous');
    set('t-com', coms, '—');
    const villes = [...new Set(tous().map(p => p.ville).filter(Boolean))].sort();
    set('f-ville', villes, 'Toutes');
    set('t-ville', villes, 'Tous');
    set('f-type', [...new Set(prospects.map(p => p.type).filter(Boolean))].sort(), 'Toutes');
  }

  function appliquerFiltresSauvegardes() {
    const f = lireFiltres();
    for (const [cle, id] of [['q','f-q'],['etat','f-etat'],['com','f-com'],['ville','f-ville'],['type','f-type'],['tri','f-tri']]) {
      if (f[cle] !== undefined) document.getElementById(id).value = f[cle];
    }
  }

  // --- Reporting --------------------------------------------------------------
  // Un compte rendu = un enregistrement dans l'espace partagé « reportings »,
  // puis jusqu'à quatre écritures EasyBeer (action FAIT, état de contact,
  // prochaine action, clôture d'anciennes actions). Chaque étape garde son
  // résultat : réessayer ne rejoue que celles qui ont échoué, sans doublon.
  const RESULTATS = [
    ['Intéressé', 'QUALIFICATION'], ['À rappeler', 'A_RECONTACTER'],
    ['Dégustation prévue', 'CONTACT_EN_COURS'], ['Devis demandé', 'VALIDATION_EN_COURS'],
    ['Pas intéressé', 'ECHEC'], ['Absent', 'TENTATIVE_CONTACT'],
  ];
  const ETAPES = { action: 'Contact enregistré dans EasyBeer', etat: 'État de contact mis à jour',
    suivante: 'Prochaine action programmée', clore: 'Anciennes actions closes' };
  let crProspect = null, crResultat = null, crPret = false;
  const isoJour = t => new Date(t).toLocaleDateString('sv-SE');
  const libEtat = c => ref.etatsContact.find(e => e.code === c)?.libelle || c || '—';
  const etiquetteP = p => `${p.nom}${p.ville ? ' — ' + p.ville : ''} (${p.numero || p.idClient})`;

  function preparerFormulaire() {
    if (crPret) return; crPret = true;
    const opt = (l, v, t) => l.map(x => `<option value="${echap(v(x))}">${echap(t(x))}</option>`).join('');
    document.getElementById('cr-type').innerHTML = opt(ref.typesAction, x => x.code, x => x.libelle);
    document.getElementById('cr-type').value = 'VISITE';
    document.getElementById('cr-ptype').innerHTML = '<option value="">Aucune</option>' + opt(ref.typesAction, x => x.code, x => x.libelle);
    document.getElementById('cr-etat').innerHTML = '<option value="">Inchangé</option>' + opt(ref.etatsContact, x => x.code, x => x.libelle);
    const coms = ref.utilisateurs.filter(u => u.actif);
    document.getElementById('cr-com').innerHTML = opt(coms, x => x.id, x => x.nom);
    document.getElementById('rp-com').innerHTML = '<option value="">Tous</option>' + opt(coms, x => x.nom, x => x.nom);
    document.getElementById('cr-res').innerHTML = RESULTATS.map(([r]) => `<button type="button" data-r="${r}">${r}</button>`).join('');
    document.getElementById('cr-date').value = isoJour(Date.now());

    document.getElementById('cr-q').addEventListener('change', e => {
      const p = prospects.find(x => etiquetteP(x) === e.target.value);
      choisirProspect(p ?? null);
    });
    document.getElementById('cr-res').addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      crResultat = b.dataset.r;
      document.querySelectorAll('#cr-res [data-r]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const code = RESULTATS.find(([r]) => r === crResultat)[1];
      if (ref.etatsContact.some(x => x.code === code)) document.getElementById('cr-etat').value = code;
    });
    document.getElementById('cr-praccourcis').addEventListener('click', e => {
      const b = e.target.closest('[data-j]'); if (!b) return;
      document.getElementById('cr-pdate').value = isoJour(AUJ() + b.dataset.j * JOUR);
      const t = document.getElementById('cr-ptype'); if (!t.value) t.value = 'APPEL';
    });
    document.getElementById('cr').addEventListener('submit', e => { e.preventDefault(); enregistrerCR(); });
    ['rp-per', 'rp-du', 'rp-au', 'rp-com'].forEach(id => document.getElementById(id).addEventListener('change', rendreTableau));
    document.getElementById('rp-csv').addEventListener('click', exporterCSV);
  }

  function choisirProspect(p) {
    crProspect = p;
    const z = document.getElementById('cr-retards');
    if (!p) { z.innerHTML = ''; return; }
    if (p.idCommercial) document.getElementById('cr-com').value = p.idCommercial;
    const retards = actions.filter(a => a.idClient === p.idClient && !ACTIONS_CLOSES.has(a.etat) && a.idAction && a.date && a.date < AUJ());
    z.innerHTML = !retards.length ? '' : `<div class="rp-champ rp-retards"><span class="rp-lbl">Actions en retard sur ce prospect — à clore ?</span>
      ${retards.map(a => `<label><input type="checkbox" value="${a.idAction}"> ${echap(a.libelle || a.typeLibelle || 'Action')} — ${fmtD(a.date)}</label>`).join('')}</div>`;
  }

  function ouvrirCompteRendu(p) {
    document.querySelector('#tabs button[data-vue="reporting"]').click();
    document.getElementById('cr-q').value = etiquetteP(p);
    choisirProspect(p);
    document.getElementById('cr-q').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  async function enregistrerCR() {
    const p = crProspect;
    const etapesEl = document.getElementById('cr-etapes');
    if (!p) { etapesEl.innerHTML = '<p class="msg ko">Choisissez un prospect dans la liste.</p>'; return; }
    if (!crResultat) { etapesEl.innerHTML = '<p class="msg ko">Indiquez le résultat du contact.</p>'; return; }
    const v = id => document.getElementById(id).value.trim();
    const com = ref.utilisateurs.find(u => String(u.id) === v('cr-com'));
    const nouvelEtat = v('cr-etat') && v('cr-etat') !== p.etatContact ? v('cr-etat') : null;
    const clore = [...document.querySelectorAll('#cr-retards input:checked')].map(i => Number(i.value));
    const r = {
      id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`,
      creeLe: Date.now(), date: new Date(v('cr-date') + 'T12:00').getTime(),
      idClient: p.idClient, nom: p.nom, ville: p.ville,
      type: v('cr-type'), typeLibelle: ref.typesAction.find(t => t.code === v('cr-type'))?.libelle ?? v('cr-type'),
      interlocuteur: v('cr-inter'), fonction: v('cr-fonction'), resultat: crResultat,
      etatAvant: p.etatContact ?? null, nouvelEtat,
      potentiel: v('cr-vol') ? { volume: Number(v('cr-vol')), unite: v('cr-unite') } : null,
      gamme: v('cr-gamme'), concurrents: v('cr-conc'), note: v('cr-note'),
      idCommercial: com?.id ?? null, commercial: com?.nom ?? '',
      suivante: v('cr-ptype') && v('cr-pdate') ? { type: v('cr-ptype'), date: new Date(v('cr-pdate') + 'T09:00').getTime() } : null,
      clore,
      etapes: { action: 'attente', etat: nouvelEtat ? 'attente' : null,
        suivante: v('cr-ptype') && v('cr-pdate') ? 'attente' : null, clore: clore.length ? 'attente' : null },
      erreurs: {},
    };
    await reportings.enregistrer(r);
    await executerCR(r);
  }

  const resumeCR = r => [
    `Résultat : ${r.resultat}`,
    r.interlocuteur && `Interlocuteur : ${r.interlocuteur}${r.fonction ? ' (' + r.fonction + ')' : ''}`,
    r.potentiel && `Potentiel : ${r.potentiel.volume} ${r.potentiel.unite}/mois`,
    r.gamme && `Gamme visée : ${r.gamme}`,
    r.concurrents && `Concurrents : ${r.concurrents}`,
    r.note && `Note : ${r.note}`,
  ].filter(Boolean).join('\n');

  async function executerCR(r) {
    const ok = document.getElementById('cr-ok'); ok.disabled = true;
    const post = (url, corps) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) }).then(verifier);
    const faire = {
      action: () => post('/api/prospection/action', { idClient: r.idClient, type: r.type, libelle: `${r.typeLibelle} — ${r.resultat}`,
        description: resumeCR(r), date: r.date, etat: 'FAIT', idResponsable: r.idCommercial ?? undefined }),
      etat: () => post('/api/prospection/etat-contact', { idClient: r.idClient, etat: r.nouvelEtat }),
      suivante: () => post('/api/prospection/action', { idClient: r.idClient, type: r.suivante.type,
        libelle: `${ref.typesAction.find(t => t.code === r.suivante.type)?.libelle ?? 'Relance'} — suite au contact du ${fmtD(r.date)}`,
        description: r.note || '', date: r.suivante.date, etat: 'A_FAIRE', idResponsable: r.idCommercial ?? undefined }),
      clore: async () => { for (const id of r.clore) await post('/api/prospection/action/clore', { idAction: id, etat: 'FAIT' }); },
    };
    for (const k of Object.keys(faire)) {
      if (r.etapes[k] !== 'attente' && r.etapes[k] !== 'ko') continue;
      afficherEtapes(r);
      try { await faire[k](); r.etapes[k] = 'ok'; delete r.erreurs[k]; }
      catch (e) { r.etapes[k] = 'ko'; r.erreurs[k] = e.message; }
      await reportings.enregistrer({ ...r });
    }
    ok.disabled = false;
    afficherEtapes(r);
    const tousOk = Object.values(r.etapes).every(x => x === null || x === 'ok');
    if (tousOk) {
      document.getElementById('cr').reset(); crProspect = null; crResultat = null;
      document.getElementById('cr-date').value = isoJour(Date.now());
      document.getElementById('cr-type').value = 'VISITE';
      document.getElementById('cr-retards').innerHTML = '';
      document.querySelectorAll('#cr-res [data-r]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    }
    await charger();   // états et actions relus dans EasyBeer
  }

  function afficherEtapes(r) {
    const el = document.getElementById('cr-etapes');
    const lignes = Object.entries(r.etapes).filter(([, v]) => v).map(([k, v]) =>
      `<li class="${v}">${v === 'ok' ? '✓' : v === 'ko' ? '✗' : '…'} ${ETAPES[k]}${v === 'ko' ? ` — <small>${echap(r.erreurs[k])}</small>` : ''}</li>`).join('');
    const echec = Object.values(r.etapes).includes('ko');
    el.innerHTML = `<p class="rp-lbl">${echap(r.nom)}</p><ul class="rp-etapes">${lignes}</ul>`
      + (echec ? `<button type="button" class="btn-raz" id="cr-reessayer">Réessayer les étapes en échec</button>` : '');
    document.getElementById('cr-reessayer')?.addEventListener('click', () => executerCR(r));
  }

  // --- Tableau ---
  function bornes() {
    const per = document.getElementById('rp-per').value;
    document.getElementById('rp-libre').hidden = document.getElementById('rp-libre2').hidden = per !== 'libre';
    const d = new Date(AUJ());
    if (per === 'semaine') { const l = new Date(d); l.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [l.getTime(), AUJ() + JOUR]; }
    if (per === 'mois') return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), AUJ() + JOUR];
    const du = document.getElementById('rp-du').value, au = document.getElementById('rp-au').value;
    return [du ? new Date(du + 'T00:00').getTime() : 0, au ? new Date(au + 'T00:00').getTime() + JOUR : Infinity];
  }
  function crPeriode() {
    const [a, b] = bornes(), com = document.getElementById('rp-com').value;
    return reportings.tout().filter(r => r.date >= a && r.date < b && (!com || r.commercial === com)).sort((x, y) => y.date - x.date);
  }

  function rendreReporting() { preparerFormulaire(); rendreTableau(); }

  function rendreTableau() {
    if (!crPret) return;
    const [a, b] = bornes(), com = document.getElementById('rp-com').value;
    const crs = crPeriode();
    // Contacts : toutes les actions FAIT de la période dans EasyBeer, y compris
    // celles saisies hors de l'appli.
    const faits = actions.filter(x => x.etat === 'FAIT' && x.date >= a && x.date < b && (!com || x.responsable === com));
    const parType = new Map();
    for (const x of faits) parType.set(x.typeLibelle || 'Autre', (parType.get(x.typeLibelle || 'Autre') ?? 0) + 1);
    const ouvertes = actions.filter(x => !ACTIONS_CLOSES.has(x.etat) && x.date && (!com || x.responsable === com));
    const retard = ouvertes.filter(x => x.date < AUJ()).length;
    const contactes = new Set(crs.map(r => r.idClient));
    const valides = [...contactes].filter(id => { const p = prospects.find(x => x.idClient === id); return !p || p.etatContact === 'VALIDE'; }).length;
    const portefeuille = prospects.filter(p => !com || p.commercial === com);
    const F = [['Non contacté', ['NON_CONTACTE']], ['Contacté', ['TENTATIVE_CONTACT', 'CONTACT_EN_COURS', 'CONTACTE', 'A_RECONTACTER']],
      ['Qualification', ['QUALIFICATION', 'VALIDATION_EN_COURS', 'BESOIN_NON_IDENTIFIE']], ['Validé', ['VALIDE']],
      ['Échecs', ['ECHEC', 'NON_QUALIFIE', 'NE_PAS_CONTACTER']]].map(([l, c]) => [l, portefeuille.filter(p => c.includes(p.etatContact)).length]);
    const maxF = Math.max(1, ...F.map(([, n]) => n));
    const passages = new Map();
    for (const r of crs) if (r.nouvelEtat) passages.set(libEtat(r.nouvelEtat), (passages.get(libEtat(r.nouvelEtat)) ?? 0) + 1);

    document.getElementById('rp-kpis').innerHTML = [
      ['', 'Contacts (EasyBeer)', faits.length], ['', 'Comptes rendus', crs.length],
      ['visite', 'Validés parmi les contactés', contactes.size ? `${valides}/${contactes.size}` : '—'],
      [retard ? 'retard' : '', 'Relances en retard', retard], ['', 'Relances à venir', ouvertes.length - retard],
    ].map(([cl, l, v]) => `<div class="kpi ${cl}"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');

    document.getElementById('rp-detail').innerHTML = `
      <div class="rp-deux">
        <div class="rp-carte"><h3>Contacts par type</h3>${[...parType].sort((x, y) => y[1] - x[1]).map(([t, n]) =>
          `<div class="rp-barre"><span>${echap(t)}</span><b>${n}</b></div>`).join('') || '<p class="carte-soustitre">Aucun contact sur la période.</p>'}</div>
        <div class="rp-carte"><h3>Passages d'état (comptes rendus)</h3>${[...passages].map(([t, n]) =>
          `<div class="rp-barre"><span>${echap(t)}</span><b>${n}</b></div>`).join('') || '<p class="carte-soustitre">Aucun changement d’état sur la période.</p>'}</div>
      </div>
      <div class="rp-carte"><h3>Entonnoir du portefeuille (aujourd'hui)</h3>
        ${F.map(([l, n]) => `<div class="rp-entonnoir"><span>${l}</span><i style="width:${Math.max(2, n / maxF * 100)}%"></i><b>${n}</b></div>`).join('')}</div>
      <div class="rp-carte"><h3>Derniers comptes rendus (${crs.length})</h3>
        ${crs.slice(0, 50).map(r => {
          const echec = Object.values(r.etapes ?? {}).includes('ko');
          return `<button class="rp-cr" data-cle="E${r.idClient}">
            <span><b>${echap(r.nom)}</b> <span class="carte-soustitre">${fmtD(r.date)} · ${echap(r.typeLibelle)} · ${echap(r.commercial)}</span><br>
            ${echap(r.resultat)}${r.nouvelEtat ? ` → ${echap(libEtat(r.nouvelEtat))}` : ''}${r.potentiel ? ` · ${r.potentiel.volume} ${r.potentiel.unite}/mois` : ''}</span>
            ${echec ? '<span class="echeance retard">écriture EasyBeer incomplète</span>' : ''}</button>`; }).join('')
          || '<p class="carte-soustitre">Aucun compte rendu sur la période.</p>'}</div>`;
    document.querySelectorAll('.rp-cr').forEach(b => b.addEventListener('click', () => ouvrirFiche(b.dataset.cle)));
  }

  function exporterCSV() {
    const c = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lignes = [['Date', 'Prospect', 'Ville', 'Commercial', 'Type', 'Interlocuteur', 'Fonction', 'Résultat', 'État avant', 'Nouvel état',
      'Potentiel', 'Gamme', 'Concurrents', 'Prochaine action', 'Note', 'Écriture EasyBeer']]
      .concat(crPeriode().map(r => [fmtD(r.date), r.nom, r.ville, r.commercial, r.typeLibelle, r.interlocuteur, r.fonction, r.resultat,
        libEtat(r.etatAvant), r.nouvelEtat ? libEtat(r.nouvelEtat) : '', r.potentiel ? `${r.potentiel.volume} ${r.potentiel.unite}/mois` : '',
        r.gamme, r.concurrents, r.suivante ? fmtD(r.suivante.date) : '', r.note,
        Object.values(r.etapes ?? {}).includes('ko') ? 'incomplète' : 'ok']));
    const blob = new Blob(['﻿' + lignes.map(l => l.map(c).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `reporting-prospection-${isoJour(Date.now())}.csv`; a.click();
    URL.revokeObjectURL(a.href);
  }

  // --- Navigation ----------------------------------------------------------
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-vue]'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('actif'));
    b.classList.add('actif'); vue = b.dataset.vue;
    ['aujourdhui','prospects','tournees','reporting'].forEach(v =>
      document.getElementById('vue-' + v).style.display = v === vue ? '' : 'none');
    rendre();
  });
  ['f-q','f-etat','f-com','f-ville','f-type','f-tri'].forEach(id =>
    document.getElementById(id).addEventListener(id === 'f-q' ? 'input' : 'change', () => { limite = 50; rendreListe(); }));
  document.getElementById('btn-raz').addEventListener('click', () => {
    ['f-q','f-etat','f-com','f-ville','f-type'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-tri').value = 'nom'; limite = 50; rendreListe();
  });
  document.getElementById('btn-plus').addEventListener('click', () => { limite += 50; rendreListe(); });
  document.getElementById('t-ville').addEventListener('change', rendreTournees);
  document.getElementById('t-vider').addEventListener('click', () => {
    if (confirm('Vider la sélection de tournée ?')) tournee.tout().slice().forEach(s => tournee.supprimer(s.id));
  });

  document.addEventListener('DOMContentLoaded', () => {
    monterCoquille({ titre: 'Prospection', actif: '/prospection.html' });
    locales.charger().then(rendre);
    reports.charger().then(rendre); reports.suivre(30_000);
    reportings.charger().then(() => { if (vue === 'reporting') rendreReporting(); }); reportings.suivre(60_000);
    tournee.charger().then(() => { if (vue === 'tournees') rendreTournees(); });
    charger();
  });
  </script>
</body>
</html>
