<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGDM — Clients à relancer</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>
  <script src="donnees.js"></script>
  <style>
    /* Styles propres aux relances. Cartes, badges, boutons, tableaux et filtres
       viennent de style.css : rien n'est redéfini ici. */
    .table-wrap { overflow-x: auto; }
    tbody tr { cursor: pointer; }
    td.produits { white-space: normal; max-width: 320px; font-size: var(--t-xs);
                  color: var(--texte-2); line-height: 1.45; }
    .retard { color: var(--danger); font-weight: 500; }
    .avance { color: var(--texte-2); }
    .zone-filtres { display: flex; gap: var(--e2); margin: 0 0 var(--e4);
                    flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .barre-actions { display: flex; gap: var(--e2); align-items: center; margin-left: auto; }
    .btn-export { min-height: var(--cible-min); border: 1px solid var(--bordure-forte);
                  background: var(--surface); color: var(--texte-2); font-size: var(--t-sm);
                  padding: 0 var(--e3); }
    .btn-export:hover { background: var(--surface-3); color: var(--texte); }
    #meta { color: var(--texte-2); font-size: var(--t-sm); margin-bottom: var(--e3); }
    #entete-impression { display: none; }

    /* Sous 768px, une ligne devient une carte lisible au doigt */
    @media (max-width: 767px) {
      .table-wrap { background: none; border: none; overflow: visible; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody tr { background: var(--surface); border: 1px solid var(--bordure);
                 border-radius: var(--r-md); padding: var(--e3); margin-bottom: var(--e2); }
      tbody td { display: flex; justify-content: space-between; gap: var(--e3);
                 padding: 3px 0; border: none; white-space: normal; text-align: right; }
      tbody td::before { content: attr(data-libelle); font-size: var(--t-xs);
                         color: var(--texte-3); text-align: left; flex: 0 0 42%; }
      tbody td:first-child { justify-content: flex-start; padding-bottom: var(--e2); }
      tbody td:first-child::before { content: none; }
      tbody td[data-libelle="Client"] { flex-direction: column; align-items: flex-start;
        text-align: left; padding-bottom: var(--e2); margin-bottom: var(--e1);
        border-bottom: 1px solid var(--bordure); }
      tbody td[data-libelle="Client"]::before { flex: none; margin-bottom: 2px; }
      tbody td[data-libelle="Client"] strong { font-size: var(--t-md); }
      td.produits { flex-direction: column; align-items: flex-start; text-align: left; max-width: none; }
      td.produits::before { flex: none; margin-bottom: 2px; }
      tbody td > * { min-width: 0; max-width: 100%; overflow-wrap: break-word; }
    }

    /* Bouton « écarter » : discret, ne doit pas voler le clic de la ligne */
    .col-ecarter { width: 74px; white-space: nowrap; }
    .col-ecarter .duo { display: flex; gap: 2px; justify-content: center; }
    .btn-ecarter { border: 1px solid transparent; background: none; color: var(--texte-3);
                   font-size: 16px; line-height: 1; border-radius: var(--r-sm);
                   min-height: 26px; min-width: 26px; cursor: pointer; }
    .btn-ecarter:hover { background: var(--danger-doux); color: var(--danger); border-color: var(--danger-doux); }
    .btn-exclure { border: 1px solid transparent; background: none; color: var(--texte-3);
                   font-size: 14px; line-height: 1; border-radius: var(--r-sm);
                   min-height: 26px; min-width: 26px; cursor: pointer; }
    .btn-exclure:hover { background: var(--surface-3); color: var(--texte); border-color: var(--bordure-forte); }
    .ligne-barre { display: flex; align-items: center; gap: var(--e3); flex-wrap: wrap; width: 100%; }
    .rang-ecarte { display: flex; align-items: center; gap: var(--e3); flex-wrap: wrap;
                   background: var(--surface); border: 1px solid var(--bordure);
                   border-radius: var(--r-sm); padding: var(--e2) var(--e4); margin-bottom: var(--e2); }
    .rang-ecarte .qui { font-weight: 600; }
    .rang-ecarte .quand { font-size: var(--t-sm); color: var(--texte-3); }
    .rang-ecarte .badge-type { font-size: 0.6875rem; font-weight: 600; border-radius: var(--r-full);
                               padding: 1px var(--e2); }
    .rang-ecarte .badge-type.semaine { background: var(--accent-doux); color: var(--accent-texte); }
    .rang-ecarte .badge-type.durable { background: var(--surface-3); color: var(--texte-2); }
    .rang-ecarte button { margin-left: auto; min-height: 30px; padding: 0 var(--e3);
                          font-size: var(--t-sm); border: 1px solid var(--bordure-forte);
                          background: var(--surface); color: var(--texte); border-radius: var(--r-sm); }
    .rang-ecarte button:hover { background: var(--surface-3); }
    .entete-ecartes { display: flex; align-items: center; gap: var(--e3); flex-wrap: wrap;
                      margin-bottom: var(--e4); }
    .entete-ecartes button { min-height: var(--cible-min); padding: 0 var(--e4); font-size: var(--t-sm);
                             border: 1px solid var(--bordure-forte); background: var(--surface);
                             color: var(--texte); border-radius: var(--r-sm); }
    .entete-ecartes button:hover { background: var(--surface-3); }
    .chips-exclus { display: flex; flex-wrap: wrap; gap: var(--e2); width: 100%; margin-top: var(--e2); }
    .chip-exclu { display: inline-flex; align-items: center; gap: var(--e2);
                  background: var(--surface); border: 1px solid var(--bordure);
                  border-radius: var(--r-full); padding: 2px var(--e3); font-size: var(--t-xs); }
    .chip-exclu button { border: none; background: none; color: var(--accent-texte);
                         font-weight: 600; font-size: var(--t-xs); min-height: 22px; padding: 0; }
    .chip-exclu button:hover { text-decoration: underline; }
    .barre-ecartes { display: none; align-items: center; gap: var(--e3); flex-wrap: wrap;
                     background: var(--surface-2); border: 1px solid var(--bordure);
                     border-radius: var(--r-sm); padding: var(--e2) var(--e3);
                     margin-bottom: var(--e3); font-size: var(--t-sm); color: var(--texte-2); }
    .barre-ecartes[data-visible] { display: flex; }
    .barre-ecartes button { border: 1px solid var(--bordure-forte); background: var(--surface);
                            color: var(--texte); font-size: var(--t-sm); min-height: 28px;
                            padding: 0 var(--e3); border-radius: var(--r-sm); }
    .barre-ecartes button:hover { background: var(--surface-3); }

    /* Impression : A4 paysage, noir sur blanc, filtre rappelé en titre */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      :root { --surface: #fff; --fond: #fff; --texte: #000; --texte-2: #333;
              --texte-3: #555; --bordure: #ccc; }
      body { background: #fff !important; }
      .zone-filtres, #meta, .menu-mobile, .barre-ecartes, .col-ecarter { display: none !important; }
      .table-wrap { border: none; overflow: visible; }
      #entete-impression { display: flex; align-items: center; gap: var(--e3);
                           border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; }
      #entete-impression img { height: 38px; }
      #entete-impression h2 { font-size: 13pt; }
      #entete-impression p { font-size: 8.5pt; color: #444; }
      table { font-size: 8.5pt; table-layout: fixed; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; }
      th, td { padding: 4px 6px; white-space: normal; }
      td { overflow-wrap: break-word; }
      th:nth-child(1),  td:nth-child(1)  { width: 8%; }
      th:nth-child(2),  td:nth-child(2)  { width: 19%; }
      th:nth-child(3),  td:nth-child(3)  { width: 9%; }
      th:nth-child(4),  td:nth-child(4)  { width: 8%; }
      th:nth-child(5),  td:nth-child(5)  { width: 9%; }
      th:nth-child(6),  td:nth-child(6)  { width: 9%; }
      th:nth-child(7),  td:nth-child(7)  { width: 6%; }
      th:nth-child(8),  td:nth-child(8)  { width: 8%; }
      th:nth-child(9),  td:nth-child(9)  { width: 19%; font-size: 7pt; }
      th:nth-child(10), td:nth-child(10) { width: 5%; text-align: center; font-size: 12pt; }
      tbody tr:hover { background: none !important; }
      .badge { border: 1px solid #000; background: none !important; color: #000 !important; }
      .case-suivi { display: table-cell !important; }
    }
    .case-suivi { display: none; }
  </style>
</head>
<body>

  <main class="large">
    <p id="meta">Chargement de l'analyse… (jusqu'à 2 min au premier chargement)</p>
    <div class="barre-ecartes" id="barre-ecartes"></div>
    <div class="zone-filtres" id="zone-filtres" style="display:none">
      <div id="filtres">
      <button data-f="tous" class="actif" aria-pressed="true">Tous</button>
      <button data-f="urgent" aria-pressed="false"><i class="puce urgent"></i>Urgent</button>
      <button data-f="cette_semaine" aria-pressed="false"><i class="puce cette_semaine"></i>Cette semaine</button>
      <button data-f="a_surveiller" aria-pressed="false"><i class="puce a_surveiller"></i>À surveiller</button>
      <button data-f="pas_prioritaire" aria-pressed="false"><i class="puce pas_prioritaire"></i>Pas prioritaire</button>
      <button data-f="ecartes" aria-pressed="false" id="btn-f-ecartes" style="margin-left:auto"><i class="puce pas_prioritaire"></i>Écartés</button>
      </div>
      <div class="barre-actions">
      <button id="btn-imprimer" class="btn-export">
        <svg class="ico" aria-hidden="true"><use href="#i-imprimer"/></svg>Imprimer
      </button>
      <button id="btn-csv" class="btn-export">
        <svg class="ico" aria-hidden="true"><use href="#i-telecharger"/></svg>Export CSV
      </button>
      </div>
    </div>

    <!-- Entête visible uniquement à l'impression -->
    <div id="entete-impression">
      <img src="logo.png" alt="">
      <div>
        <h2>Clients à relancer — <span id="imp-filtre"></span></h2>
        <p id="imp-meta"></p>
      </div>
    </div>
    <div id="vue-ecartes" style="display:none"></div>
    <div class="table-wrap" style="display:none" id="wrap">
      <table>
        <thead>
          <tr>
            <th class="col-ecarter"><span class="sr-only">Écarter de la liste</span></th>
            <th>Priorité</th>
            <th>Client</th>
            <th>Dernière commande</th>
            <th>Fréquence moy.</th>
            <th>Prochaine estimée</th>
            <th>Écart</th>
            <th>Vol. moyen</th>
            <th>Montant moy. HT</th>
            <th>Produits habituels</th>
            <th class="case-suivi">Fait</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    monterCoquille({ titre: 'Clients à relancer', actif: '/relances.html' });
    const LABELS = { urgent: 'Urgent', cette_semaine: 'Cette semaine', a_surveiller: 'À surveiller', pas_prioritaire: 'Pas prioritaire' };
    let clients = [];

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    }

    let filtreCourant = 'tous';
    let listeAffichee = [];

    // ---- Clients écartés pour la semaine en cours ----
    // Écarter un client le sort de la liste jusqu'au lundi suivant : la relance
    // a été faite, ou le client a dit non pour cette fois. La semaine ISO sert
    // de clé, donc la liste se remet à zéro toute seule au changement de
    // semaine — aucun ménage à faire. Partagé avec l'équipe quand la base est
    // configurée : inutile que deux personnes rappellent le même client.
    const ecartes = creerMagasin('relances', { surChangement: () => render(filtreCourant) });

    function semaineISO(d = new Date()) {
      const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));   // jeudi de la semaine
      const debut = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
      const n = Math.ceil(((t - debut) / 86400000 + 1) / 7);
      return `${t.getUTCFullYear()}-S${String(n).padStart(2, '0')}`;
    }

    // Deux niveaux : écarté pour la semaine en cours, ou exclu durablement.
    const cleEcart = idClient => `${semaineISO()}-${idClient}`;
    const cleExclu = idClient => `perm-${idClient}`;
    const ecartesSemaine = () => ecartes.tout().filter(e => e.semaine === semaineISO());
    const exclusDurables = () => ecartes.tout().filter(e => e.permanent);
    const estEcarte = c => ecartes.tout().some(e =>
      e.id === cleEcart(c.idClient) || e.id === cleExclu(c.idClient));

    function ecarter(c) {
      ecartes.enregistrer({
        id: cleEcart(c.idClient), semaine: semaineISO(),
        idClient: c.idClient, nom: c.nom, masqueLe: Date.now(),
      });
    }

    function exclure(c) {
      ecartes.enregistrer({
        id: cleExclu(c.idClient), permanent: true,
        idClient: c.idClient, nom: c.nom, exclusLe: Date.now(),
      });
      // L'écart hebdomadaire devient inutile s'il existait
      if (ecartes.tout().some(e => e.id === cleEcart(c.idClient))) ecartes.supprimer(cleEcart(c.idClient));
    }

    // Compteur porté par l'onglet : on voit d'un coup d'œil combien sont mis de côté
    function majCompteurEcartes() {
      const b = document.getElementById('btn-f-ecartes');
      if (!b) return;
      const n = ecartesSemaine().length + exclusDurables().length;
      b.innerHTML = `<i class="puce pas_prioritaire"></i>Écartés${n ? ` (${n})` : ''}`;
    }

    function majBarreEcartes() {
      const barre = document.getElementById('barre-ecartes');
      const semaine = ecartesSemaine();
      const durables = exclusDurables();
      if (!semaine.length && !durables.length) {
        delete barre.dataset.visible; barre.innerHTML = ''; return;
      }
      barre.dataset.visible = '1';

      // Bandeau volontairement compact : avec cent clients écartés, lister les
      // noms ici noierait la page. Le détail vit dans la catégorie « Écartés ».
      const bouts = [];
      if (semaine.length) bouts.push(`<strong>${semaine.length}</strong> écarté(s) cette semaine`);
      if (durables.length) bouts.push(`<strong>${durables.length}</strong> exclu(s) durablement`);
      barre.innerHTML = `<div class="ligne-barre">
        <span>${bouts.join(' · ')}</span>
        <button id="btn-voir-ecartes" style="margin-left:auto">Voir la liste</button>
      </div>`;
      document.getElementById('btn-voir-ecartes').addEventListener('click', () => {
        document.querySelector('#filtres button[data-f="ecartes"]').click();
      });
    }

    // ---- Vue dédiée : consulter et réintégrer les clients écartés ----
    function renderEcartes() {
      const el = document.getElementById('vue-ecartes');
      const semaine = ecartesSemaine();
      const durables = exclusDurables();
      const liste = [
        ...semaine.map(e => ({ ...e, type: 'semaine' })),
        ...durables.map(e => ({ ...e, type: 'durable' })),
      ].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));

      if (!liste.length) {
        el.innerHTML = `<p style="color:var(--texte-3);text-align:center;padding:24px">`
          + `Aucun client écarté. Utilisez « &times; » ou « &empty; » sur une ligne pour en retirer.</p>`;
        return;
      }
      el.innerHTML = `<div class="entete-ecartes">
          <span>${liste.length} client(s) retiré(s) de la liste des relances</span>
          ${semaine.length ? `<button id="btn-reafficher">Réafficher les ${semaine.length} de cette semaine</button>` : ''}
        </div>`
        + liste.map(e => `<div class="rang-ecarte">
            <span class="badge-type ${e.type}">${e.type === 'semaine' ? 'cette semaine' : 'durable'}</span>
            <span class="qui">${e.nom}</span>
            <span class="quand">${e.type === 'semaine'
              ? 'écarté le ' + new Date(e.masqueLe).toLocaleDateString('fr-FR')
              : 'exclu le ' + new Date(e.exclusLe).toLocaleDateString('fr-FR')}</span>
            <button data-reintegrer="${e.id}">Réintégrer</button>
          </div>`).join('');

      document.getElementById('btn-reafficher')?.addEventListener('click', () => {
        semaine.forEach(e => ecartes.supprimer(e.id));
      });
      el.querySelectorAll('[data-reintegrer]').forEach(b =>
        b.addEventListener('click', () => ecartes.supprimer(b.dataset.reintegrer)));
    }

    function render(filtre) {
      filtreCourant = filtre;
      // La catégorie « Écartés » remplace le tableau par sa propre liste
      const vueEcartes = filtre === 'ecartes';
      document.getElementById('vue-ecartes').style.display = vueEcartes ? 'block' : 'none';
      document.getElementById('wrap').style.display = vueEcartes ? 'none' : 'block';
      majCompteurEcartes();
      if (vueEcartes) {
        listeAffichee = [];   // l'export CSV ne doit pas resservir la liste précédente
        renderEcartes();
        // le bandeau ferait doublon avec la liste qu'on est en train de consulter
        delete document.getElementById('barre-ecartes').dataset.visible;
        document.getElementById('meta').textContent =
          `${ecartesSemaine().length + exclusDurables().length} client(s) écarté(s) — `
          + `les écarts de la semaine tombent lundi prochain, les exclusions durables restent.`;
        return;
      }
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      const visibles = clients.filter(c => !estEcarte(c));
      const list = filtre === 'tous' ? visibles : visibles.filter(c => c.priorite === filtre);
      for (const c of list) {
        const tr = document.createElement('tr');
        tr.title = 'Créer une commande pour ' + c.nom;
        tr.addEventListener('click', () => { location.href = '/?client=' + c.idClient; });
        let ecart = '—';
        if (c.joursRetard != null) {
          ecart = c.joursRetard > 0
            ? `<span class="retard">+${c.joursRetard} j de retard</span>`
            : `<span class="avance">dans ${-c.joursRetard} j</span>`;
        }
        tr.innerHTML = `
          <td class="col-ecarter" data-libelle="Écarter"><span class="duo"><button type="button" class="btn-ecarter"
              title="Écarter cette semaine — il reviendra lundi prochain"
              aria-label="Écarter ${c.nom} de la liste cette semaine">&times;</button><button
              type="button" class="btn-exclure"
              title="Exclure durablement — il ne réapparaîtra plus tant que vous ne le réintégrez pas"
              aria-label="Exclure durablement ${c.nom} de la liste">&#8709;</button></span></td>
          <td data-libelle="Priorité"><span class="badge ${c.priorite}">${LABELS[c.priorite]}</span></td>
          <td data-libelle="Client"><strong>${c.nom}</strong><br><small>${c.nbCommandes} commandes</small></td>
          <td data-libelle="Dernière commande">${fmtDate(c.dateDerniereCommande)}</td>
          <td data-libelle="Fréquence">${c.frequenceMoyenneJours != null ? c.frequenceMoyenneJours + ' j' : '—'}</td>
          <td data-libelle="Prochaine estimée">${fmtDate(c.dateProchaineEstimee)}</td>
          <td data-libelle="Écart">${ecart}</td>
          <td data-libelle="Volume moyen">${c.volumeMoyen || '—'}</td>
          <td data-libelle="Montant moyen HT">${c.montantMoyenHT ? c.montantMoyenHT.toFixed(2) + ' €' : '—'}</td>
          <td class="produits" data-libelle="Produits habituels" title="${(c.produitsHabituels ?? []).join(' · ')}">${(c.produitsHabituels ?? []).join(', ') || '—'}</td>
          <td class="case-suivi" data-libelle="Fait"><span class="case">&#9744;</span></td>`;
        // stopPropagation : sans cela, le clic ouvrirait la prise de commande
        tr.querySelector('.btn-ecarter').addEventListener('click', ev => {
          ev.stopPropagation(); ecarter(c);
        });
        tr.querySelector('.btn-exclure').addEventListener('click', ev => {
          ev.stopPropagation();
          if (confirm(`Exclure durablement ${c.nom} de la liste des relances ?\n\n`
            + `Il ne réapparaîtra plus les semaines suivantes. Vous pourrez le réintégrer `
            + `à tout moment depuis le bandeau « exclus durablement ».`)) exclure(c);
        });
        tbody.appendChild(tr);
      }
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="11" style="color:var(--texte-3);text-align:center;padding:24px">`
          + (clients.length
              ? ((ecartesSemaine().length || exclusDurables().length) && !visibles.length
                  ? 'Tous les clients ont été traités cette semaine.'
                  : 'Aucun client dans cette catégorie — essayez un autre filtre.')
              : 'Aucune donnée d\'analyse disponible.')
          + '</td></tr>';
      }
      listeAffichee = list;
      majBarreEcartes();
      const nomFiltre = filtre === 'tous' ? 'toutes priorités' : LABELS[filtre];
      document.getElementById('meta').innerHTML =
        `${list.length} client(s) affiché(s) sur ${clients.length} — analyse générée le ${new Date(window._genere).toLocaleString('fr-FR')}`
        + (ecartesSemaine().length ? ` · ${ecartesSemaine().length} écarté(s) cette semaine` : '')
        + (exclusDurables().length ? ` · ${exclusDurables().length} exclu(s) durablement` : '')
        + (window._inactifs
            ? ` · <span style="color:var(--texte-3)">${window._inactifs} client(s) désactivé(s) dans EasyBeer, exclus</span>`
            : '');
      // Entête repris sur la version imprimée
      document.getElementById('imp-filtre').textContent = nomFiltre;
      document.getElementById('imp-meta').textContent =
        `${list.length} client(s) · Le Gué des Moines · édité le ${new Date().toLocaleDateString('fr-FR')}`
        + ` · analyse du ${new Date(window._genere).toLocaleString('fr-FR')}`;
    }

    // ---- Impression : le tableau affiché suit déjà le filtre actif ----
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

    // ---- Export CSV du tableau filtré (ouvrable dans Excel / LibreOffice) ----
    document.getElementById('btn-csv').addEventListener('click', () => {
      const colonnes = ['Priorité', 'Client', 'Nb commandes', 'Dernière commande', 'Fréquence (j)',
                        'Prochaine estimée', 'Écart (j)', 'Volume moyen', 'Montant moyen HT', 'Produits habituels'];
      const echappe = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lignes = listeAffichee.map(c => [
        LABELS[c.priorite], c.nom, c.nbCommandes,
        fmtDate(c.dateDerniereCommande), c.frequenceMoyenneJours ?? '',
        fmtDate(c.dateProchaineEstimee), c.joursRetard ?? '',
        c.volumeMoyen ?? '', c.montantMoyenHT ?? '',
        (c.produitsHabituels ?? []).join(' | '),
      ].map(echappe).join(';'));
      // BOM UTF-8 + séparateur ';' : ouverture directe et accents corrects sous Excel FR
      const csv = '\ufeff' + [colonnes.map(echappe).join(';'), ...lignes].join('\r\n');
      const nom = `relances-${filtreCourant}-${new Date().toISOString().slice(0, 10)}.csv`;
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: nom });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    document.getElementById('filtres').addEventListener('click', e => {
      const btn = e.target.closest('button[data-f]');
      if (!btn) return;
      document.querySelectorAll('#filtres button[data-f]').forEach(b => {
        b.classList.remove('actif');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('actif');
      btn.setAttribute('aria-pressed', 'true');
      render(btn.dataset.f);
    });

    // La liste des écartés peut arriver avant ou après l'analyse : chaque
    // chargement redessine, donc l'ordre n'a pas d'importance.
    ecartes.charger().then(() => { if (clients.length) render(filtreCourant); });
    ecartes.suivre();

    fetch('/api/relances')
      .then(r => r.json())
      .then(data => {
        if (data.error) throw new Error(data.error);
        clients = data.clients ?? [];
        window._genere = data.generePour;
        window._inactifs = data.nbInactifsExclus;
        document.getElementById('zone-filtres').style.display = 'flex';
        menuMobile('#filtres', 'data-f', 'Filtrer par priorité');
        replierActions('.barre-actions', '.btn-export', 'Exporter');
        document.getElementById('wrap').style.display = 'block';
        render('tous');
      })
      .catch(err => {
        document.getElementById('meta').innerHTML =
          `<span class="error">Analyse indisponible : ${err.message}</span>`
          + ' — l\'API EasyBeer est momentanément saturée, réessayez dans quelques minutes.';
      });
  </script>
</body>
</html>
