<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGDM — Clients à relancer</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'dark';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap { overflow-x: auto; background: var(--card); border-radius: var(--radius); padding: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: rgba(232,160,32,0.08); }
    th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    td.produits { white-space: normal; max-width: 300px; font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
    tbody tr:hover td { background: var(--tint-amber); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; color: #fff; }
    .badge.urgent { background: #c0392b; }
    .badge.cette_semaine { background: #e8a020; }
    .badge.a_surveiller { background: #2980b9; }
    .badge.pas_prioritaire { background: #95a5a6; }
    .retard { color: #c0392b; font-weight: 600; }
    .avance { color: #27ae60; }
    #filtres { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    #filtres button { border: 1px solid var(--border); background: var(--card); border-radius: 20px; padding: 6px 14px; cursor: pointer; font-size: 0.8rem; }
    #filtres button.actif { background: var(--amber); color: #14120f; border-color: var(--amber); }
    #meta { color: var(--muted); font-size: 0.8rem; margin: 8px 0; }
    #filtres .btn-export {
      border-color: var(--pill-border); color: var(--amber);
      font-weight: 600; background: transparent;
    }
    #filtres .btn-export:hover { background: var(--tint-amber); border-color: var(--amber); }
    #entete-impression { display: none; }

    /* ---- Impression : feuille A4 paysage, encre économisée, filtre en titre ---- */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      /* Rendu clair quel que soit le thème choisi à l'écran */
      :root, :root[data-theme="dark"] {
        --card: #fff; --card2: #fff; --bg: #fff; --text: #000;
        --muted: #444; --border: #bbb; --amber: #a8620d;
      }
      body { background: #fff !important; color: #000 !important; }
      header, #filtres, #meta, .btn-retour, .btn-theme { display: none !important; }
      main { max-width: none !important; padding: 0 !important; gap: 0 !important; }
      .table-wrap { overflow: visible !important; background: none; padding: 0; border-radius: 0; }

      #entete-impression {
        display: flex; align-items: center; gap: 12px;
        border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px;
      }
      #entete-impression img { height: 40px; filter: invert(1); flex-shrink: 0; }
      #entete-impression > div { min-width: 0; }
      #entete-impression h2 { font-size: 14pt; color: #000; margin: 0; }
      #entete-impression p { font-size: 9pt; color: #444; margin: 2px 0 0; }

      /* Largeurs fixes pour tenir dans la largeur d'une A4 paysage */
      table { font-size: 8.5pt; width: 100%; table-layout: fixed; }
      thead { display: table-header-group; }  /* en-têtes répétés à chaque page */
      tr { page-break-inside: avoid; }
      th, td { padding: 4px 6px; border-bottom: 1px solid #ccc; color: #000; white-space: normal; }
      td { overflow-wrap: break-word; }   /* les titres ne coupent qu'aux espaces */
      th:nth-child(1),  td:nth-child(1)  { width: 8%; }
      th:nth-child(2),  td:nth-child(2)  { width: 19%; }
      th:nth-child(3),  td:nth-child(3)  { width: 9%; }
      th:nth-child(4),  td:nth-child(4)  { width: 8%; }
      th:nth-child(5),  td:nth-child(5)  { width: 9%; }
      th:nth-child(6),  td:nth-child(6)  { width: 9%; }
      th:nth-child(7),  td:nth-child(7)  { width: 6%; }
      th:nth-child(8),  td:nth-child(8)  { width: 8%; }
      th:nth-child(9),  td:nth-child(9)  { width: 19%; }
      th:nth-child(10), td:nth-child(10) { width: 5%; text-align: center; font-size: 12pt; }
      th { color: #000; border-bottom: 1.5px solid #000; }
      td.produits { max-width: none; font-size: 7pt; color: #333; line-height: 1.25; }
      tbody tr, tbody tr:hover, tbody tr:hover td { background: none !important; cursor: default; }
      /* Badges lisibles en noir et blanc */
      .badge { color: #000 !important; background: none !important; border: 1px solid #000;
               padding: 1px 6px; font-size: 7.5pt; }
      .retard { color: #000; font-weight: 700; }
      .avance { color: #444; font-weight: 400; }
      /* Case à cocher pour le suivi papier */
      .case-suivi { display: table-cell !important; }
    }
    .case-suivi { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="Le Gué des Moines">
      <h1>Clients à relancer<small>Le Gué des Moines</small></h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/" class="btn-retour">← Commande</a>
      <button class="btn-theme" id="btn-theme" title="Basculer clair/sombre">☀️</button>
    </div>
  </header>
  <script>
    document.getElementById('btn-theme').addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('lgdm-theme', t);
      document.documentElement.dataset.theme = t;
    });
  </script>

  <main style="max-width: 1100px;">
    <p id="meta">Chargement de l'analyse… (jusqu'à 2 min au premier chargement)</p>
    <div id="filtres" style="display:none">
      <button data-f="tous" class="actif">Tous</button>
      <button data-f="urgent">🔴 Urgent</button>
      <button data-f="cette_semaine">🟠 Cette semaine</button>
      <button data-f="a_surveiller">🔵 À surveiller</button>
      <button data-f="pas_prioritaire">⚪ Pas prioritaire</button>
      <span style="flex:1"></span>
      <button id="btn-imprimer" class="btn-export">🖨️ Imprimer</button>
      <button id="btn-csv" class="btn-export">⬇️ Export CSV</button>
    </div>

    <!-- Entête visible uniquement à l'impression -->
    <div id="entete-impression">
      <img src="logo.png" alt="">
      <div>
        <h2>Clients à relancer — <span id="imp-filtre"></span></h2>
        <p id="imp-meta"></p>
      </div>
    </div>
    <div class="table-wrap" style="display:none" id="wrap">
      <table>
        <thead>
          <tr>
            <th>Priorité</th>
            <th>Client</th>
            <th>Dernière commande</th>
            <th>Fréquence moy.</th>
            <th>Prochaine estimée</th>
            <th>Écart</th>
            <th>Vol. moyen</th>
            <th>Montant moy. HT</th>
            <th>Produits habituels</th>
            <th class="case-suivi">Fait</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const LABELS = { urgent: 'Urgent', cette_semaine: 'Cette semaine', a_surveiller: 'À surveiller', pas_prioritaire: 'Pas prioritaire' };
    let clients = [];

    function fmtDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    }

    let filtreCourant = 'tous';
    let listeAffichee = [];

    function render(filtre) {
      filtreCourant = filtre;
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      const list = filtre === 'tous' ? clients : clients.filter(c => c.priorite === filtre);
      for (const c of list) {
        const tr = document.createElement('tr');
        tr.title = 'Créer une commande pour ' + c.nom;
        tr.addEventListener('click', () => { location.href = '/?client=' + c.idClient; });
        let ecart = '—';
        if (c.joursRetard != null) {
          ecart = c.joursRetard > 0
            ? `<span class="retard">+${c.joursRetard} j de retard</span>`
            : `<span class="avance">dans ${-c.joursRetard} j</span>`;
        }
        tr.innerHTML = `
          <td><span class="badge ${c.priorite}">${LABELS[c.priorite]}</span></td>
          <td><strong>${c.nom}</strong><br><small>${c.nbCommandes} commandes</small></td>
          <td>${fmtDate(c.dateDerniereCommande)}</td>
          <td>${c.frequenceMoyenneJours != null ? c.frequenceMoyenneJours + ' j' : '—'}</td>
          <td>${fmtDate(c.dateProchaineEstimee)}</td>
          <td>${ecart}</td>
          <td>${c.volumeMoyen || '—'}</td>
          <td>${c.montantMoyenHT ? c.montantMoyenHT.toFixed(2) + ' €' : '—'}</td>
          <td class="produits" title="${(c.produitsHabituels ?? []).join(' · ')}">${(c.produitsHabituels ?? []).join(', ') || '—'}</td>
          <td class="case-suivi">☐</td>`;
        tbody.appendChild(tr);
      }
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="10" style="color:var(--muted);text-align:center;padding:24px">`
          + (clients.length
              ? 'Aucun client dans cette catégorie — essayez un autre filtre.'
              : 'Aucune donnée d\'analyse disponible.')
          + '</td></tr>';
      }
      listeAffichee = list;
      const nomFiltre = filtre === 'tous' ? 'toutes priorités' : LABELS[filtre];
      document.getElementById('meta').textContent =
        `${list.length} client(s) affiché(s) sur ${clients.length} — analyse générée le ${new Date(window._genere).toLocaleString('fr-FR')}`;
      // Entête repris sur la version imprimée
      document.getElementById('imp-filtre').textContent = nomFiltre;
      document.getElementById('imp-meta').textContent =
        `${list.length} client(s) · Le Gué des Moines · édité le ${new Date().toLocaleDateString('fr-FR')}`
        + ` · analyse du ${new Date(window._genere).toLocaleString('fr-FR')}`;
    }

    // ---- Impression : le tableau affiché suit déjà le filtre actif ----
    document.getElementById('btn-imprimer').addEventListener('click', () => window.print());

    // ---- Export CSV du tableau filtré (ouvrable dans Excel / LibreOffice) ----
    document.getElementById('btn-csv').addEventListener('click', () => {
      const colonnes = ['Priorité', 'Client', 'Nb commandes', 'Dernière commande', 'Fréquence (j)',
                        'Prochaine estimée', 'Écart (j)', 'Volume moyen', 'Montant moyen HT', 'Produits habituels'];
      const echappe = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lignes = listeAffichee.map(c => [
        LABELS[c.priorite], c.nom, c.nbCommandes,
        fmtDate(c.dateDerniereCommande), c.frequenceMoyenneJours ?? '',
        fmtDate(c.dateProchaineEstimee), c.joursRetard ?? '',
        c.volumeMoyen ?? '', c.montantMoyenHT ?? '',
        (c.produitsHabituels ?? []).join(' | '),
      ].map(echappe).join(';'));
      // BOM UTF-8 + séparateur ';' : ouverture directe et accents corrects sous Excel FR
      const csv = '\ufeff' + [colonnes.map(echappe).join(';'), ...lignes].join('\r\n');
      const nom = `relances-${filtreCourant}-${new Date().toISOString().slice(0, 10)}.csv`;
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: nom });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    document.getElementById('filtres').addEventListener('click', e => {
      const btn = e.target.closest('button[data-f]');
      if (!btn) return;
      document.querySelectorAll('#filtres button').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      render(btn.dataset.f);
    });

    fetch('/api/relances')
      .then(r => r.json())
      .then(data => {
        if (data.error) throw new Error(data.error);
        clients = data.clients ?? [];
        window._genere = data.generePour;
        document.getElementById('filtres').style.display = 'flex';
        document.getElementById('wrap').style.display = 'block';
        render('tous');
      })
      .catch(err => {
        document.getElementById('meta').innerHTML =
          `<span class="error">Analyse indisponible : ${err.message}</span>`
          + ' — l\'API EasyBeer est momentanément saturée, réessayez dans quelques minutes.';
      });
  </script>
</body>
</html>
