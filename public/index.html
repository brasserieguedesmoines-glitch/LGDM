<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F7F8">
  <title>Prise de commande — Le Gué des Moines</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="shell.js"></script>
</head>
<body>
  <main class="etroit">
    <!-- Étape 1 : sélection du client -->
    <section id="section-client" aria-labelledby="titre-client">
      <div>
        <h2 id="titre-client">Client</h2>
        <p class="carte-soustitre">Sélectionnez le client pour charger sa grille tarifaire.</p>
      </div>
      <div>
        <label for="champ-client">Rechercher un client</label>
        <!-- le champ est inséré ici par app.js -->
      </div>
      <p id="msg-statut-client" role="status" aria-live="polite"></p>
      <button id="btn-derniere-commande" class="secondary" style="display:none">
        <svg class="ico" aria-hidden="true"><use href="#i-horloge"/></svg>
        Recharger la dernière commande
      </button>
    </section>

    <!-- Étape 2 : lignes de produit -->
    <section id="section-produits" style="display:none" aria-labelledby="titre-produits">
      <h2 id="titre-produits">Produits</h2>
      <div id="info-gamme" style="display:none">
        <span class="info-gamme-txt"></span>
        <button type="button" id="btn-toutes-gammes">Afficher toute la gamme</button>
      </div>
      <div id="lignes-container"></div>
      <button id="btn-ajouter-ligne" class="secondary">
        <svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>Ajouter un produit
      </button>
    </section>

    <!-- Note de livraison -->
    <section id="section-note" style="display:none" aria-labelledby="titre-note">
      <h2 id="titre-note">Note de livraison</h2>
      <div>
        <label for="note-livraison">Instructions pour le livreur</label>
        <textarea id="note-livraison" rows="3" aria-describedby="aide-note"
                  placeholder="Horaire, accès, code portail…"></textarea>
        <p id="aide-note" class="carte-soustitre" style="margin-top:var(--e2)">
          Cette note apparaît sur le bon de livraison.
        </p>
      </div>
    </section>

    <!-- Envoi -->
    <section id="section-envoi" style="display:none">
      <button id="btn-envoyer" class="primary">Envoyer la commande</button>
      <button id="btn-attente" class="secondary"
              title="Enregistre la commande dans la liste des ruptures, sans rien envoyer à EasyBeer">
        <svg class="ico" aria-hidden="true"><use href="#i-horloge"/></svg>
        Mettre en attente (rupture)
      </button>
      <p id="msg-statut" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Confirmation -->
  <div id="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
    <div id="modal">
      <svg class="ico ico-xl modal-ico" aria-hidden="true"><use href="#i-check"/></svg>
      <h2 id="modal-titre">Commande envoyée</h2>
      <p id="modal-detail"></p>
      <button id="btn-nouvelle-commande" class="primary">Nouvelle commande</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      monterCoquille({ titre: 'Prise de commande', actif: '/' });
    });
  </script>
  <script src="app.js" defer></script>
</body>
</html>
