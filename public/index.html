<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>LGDM — Prise de commande</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('lgdm-theme') || 'dark';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="Le Gué des Moines">
      <h1>Prise de commande<small>Le Gué des Moines</small></h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <a href="/pilotage.html" class="btn-pdf">📊 Pilotage</a>
      <a href="/relances.html" class="btn-pdf">📋 Relances</a>
      <a href="/api/commandes-pdf" target="_blank" id="btn-pdf" class="btn-pdf">📄 PDF</a>
      <button class="btn-theme" id="btn-theme" title="Basculer clair/sombre">☀️</button>
    </div>
  </header>
  <script>
    document.getElementById('btn-theme').addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('lgdm-theme', t);
      document.documentElement.dataset.theme = t;
    });
  </script>

  <main>
    <!-- Étape 1 : Sélection client -->
    <section id="section-client">
      <label>Client</label>
      <p id="msg-statut-client"></p>
      <button id="btn-derniere-commande" class="secondary" style="display:none">
        Recharger la dernière commande
      </button>
    </section>

    <!-- Étape 2 : Lignes de produit -->
    <section id="section-produits" style="display:none">
      <h2>Produits</h2>
      <div id="info-gamme" style="display:none">
        <span class="info-gamme-txt"></span>
        <button type="button" id="btn-toutes-gammes">Afficher toute la gamme</button>
      </div>
      <div id="lignes-container"></div>
      <button id="btn-ajouter-ligne" class="secondary">+ Ajouter un produit</button>
    </section>

    <!-- Note de livraison -->
    <section id="section-note" style="display:none">
      <label for="note-livraison">Note de livraison</label>
      <textarea id="note-livraison" rows="3" placeholder="Horaire, accès, instructions particulières…"></textarea>
    </section>

    <!-- Envoi -->
    <section id="section-envoi" style="display:none">
      <button id="btn-envoyer" class="primary">Envoyer la commande</button>
      <p id="msg-statut"></p>
    </section>
  </main>

  <!-- Modal de confirmation -->
  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <h2>Commande envoyée ✓</h2>
      <p id="modal-detail"></p>
      <button id="btn-nouvelle-commande" class="primary">Nouvelle commande</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
